<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Static Trace 3D</title>

  <!--
    OFFLINE-SAFE: three.min.js and OrbitControls.js are bundled in assets/3d/.
    No CDN dependency — works in a basement with zero signal.
  -->
  <script type="importmap">
    {
      "imports": {
        "three": "./three.min.js",
        "three/addons/": "./"
      }
    }
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #FAF7F2; }

    #canvas-container { position: fixed; inset: 0; }

    /* ── Flutter Native App Mode (Suppresses double-UI collision) ── */
    body.is-native-app #sidebar,
    body.is-native-app #hud,
    body.is-native-app #reset-view-btn,
    body.is-native-app #cabinet-action-bar {
      display: none !important;
    }

    /* ── Cabinet sidebar ─────────────────────────────────────────── */
    #sidebar {
      position: fixed;
      right: 0; top: 0; bottom: 0;
      width: 96px;
      background: rgba(250, 247, 242, 0.94);
      border-left: 1px solid #DDD5CA;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 6px;
      gap: 10px;
      backdrop-filter: blur(8px);
      z-index: 10;
      overflow-y: auto;
    }
    #sidebar h4 {
      color: #7A6A5C;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      text-align: center;
      margin-bottom: 4px;
    }
    .cab-btn {
      width: 80px;
      background: #FFFFFF;
      border: 1px solid #DDD5CA;
      border-radius: 10px;
      padding: 10px 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      color: #2C2724;
      font-family: system-ui, sans-serif;
    }
    .cab-btn:active { transform: scale(0.93); background: #E6BEAE33; border-color: #B2967D; }
    .cab-btn svg { opacity: 0.9; }
    .cab-btn span { font-size: 10px; text-align: center; line-height: 1.2; font-weight: 500; }

    /* ── HUD ─────────────────────────────────────────────────────── */
    #hud {
      position: fixed;
      bottom: 16px; left: 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #DDD5CA;
      border-radius: 10px;
      padding: 8px 14px;
      color: #7A6A5C;
      font-size: 11px;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      pointer-events: none;
      box-shadow: 0 4px 12px rgba(44, 39, 36, 0.06);
    }
    #cabinet-count { color: #2C2724; font-weight: 700; }

    /* ── Reset View Button ───────────────────────────────────────── */
    #reset-view-btn {
      position: fixed;
      top: 16px; left: 16px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid #DDD5CA;
      border-radius: 8px;
      padding: 8px 12px;
      color: #2C2724;
      font-size: 12px;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(6px);
      z-index: 10;
      transition: all 0.15s ease;
      box-shadow: 0 2px 8px rgba(44, 39, 36, 0.06);
    }
    #reset-view-btn:active { background: #F7F3ED; border-color: #B2967D; }

    /* ── Cabinet Action Bar ───────────────────────────────────────── */
    #cabinet-action-bar {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(140px);
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid #DDD5CA;
      border-radius: 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 24px rgba(44, 39, 36, 0.12);
      z-index: 30;
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    #cabinet-action-bar.show {
      transform: translateX(-50%) translateY(0);
    }
    .cab-info {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #2C2724;
      font-size: 13px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
    }
    .cab-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #B2967D;
    }
    #remove-cab-btn {
      background: #C95A5A;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      font-size: 12px;
      font-weight: 600;
      font-family: system-ui, sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }
    #remove-cab-btn:active { background: #ab4444; }
    #close-cab-action-btn {
      background: transparent;
      border: none;
      color: #7A6A5C;
      font-size: 14px;
      cursor: pointer;
      padding: 4px;
    }

    /* ── Toast ───────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      top: 20px; left: 50%; transform: translateX(-50%);
      background: #2C2724;
      color: #FAF7F2;
      border-radius: 20px;
      padding: 8px 20px;
      font-size: 13px;
      font-family: system-ui, sans-serif;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
      z-index: 20;
      box-shadow: 0 4px 14px rgba(44, 39, 36, 0.15);
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- ═══════════════════════════════════════════════════════════════════
     OFFLINE 3D ENGINE — ES module imports from bundled local files
     three.min.js  (654 KB)  ← assets/3d/three.min.js
     OrbitControls.js (29 KB) ← assets/3d/OrbitControls.js
     ═══════════════════════════════════════════════════════════════ -->
<script type="module">
import * as THREE from './three.min.js';
import { OrbitControls } from './OrbitControls.js';

// ── Expose globals so onclick= handlers in HTML can reach them ─────────────
window._THREE = THREE;
window._OrbitControls = OrbitControls;

const MM = 0.001; // 1mm in Three.js scene units (1 unit = 1 metre)

let scene, camera, renderer, controls;
let keyLight = null, fillLight = null; // the lights a rendered picture adjusts
let placedCabinets = [];
let cabinetCount = 0;
let currentWallDepth = 0.15; // default 150mm depth
let scenePayload = {};       // last payload passed to loadScene()

// ── Scene init ─────────────────────────────────────────────────────────────
function initScene() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xFAF7F2); // Soft Linen Cream
  scene.fog = new THREE.FogExp2(0xFAF7F2, 0.02);

  const sidebarW = 96;
  const w = window.innerWidth - sidebarW;
  const h = window.innerHeight;

  camera = new THREE.PerspectiveCamera(50, w / h, 0.05, 500);
  camera.position.set(0, 1.6, 5);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.setSize(w, h);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.12;
  if (THREE.SRGBColorSpace) renderer.outputColorSpace = THREE.SRGBColorSpace;
  document.getElementById('canvas-container').appendChild(renderer.domElement);
  initMaterials();
  buildEnvironment();

  controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.2;
  controls.maxDistance = 50;
  controls.maxPolarAngle = Math.PI / 2;

  // ── Daylight: soft sky fill + one warm key light (window side) with shadows.
  // Most of the soft light and all reflections come from buildEnvironment().
  fillLight = new THREE.HemisphereLight(0xfffaf2, 0xc9b8a4, 0.35);
  scene.add(fillLight);

  const dir = new THREE.DirectionalLight(0xfff0dc, 1.5);
  dir.position.set(3.5, 6.5, 5);
  dir.castShadow = true;
  dir.shadow.mapSize.set(2048, 2048);
  dir.shadow.bias = -0.0004;
  dir.shadow.normalBias = 0.015;
  dir.shadow.radius = 3;
  Object.assign(dir.shadow.camera, { near: 0.1, far: 30, left: -8, right: 8, top: 6, bottom: -2 });
  scene.add(dir);
  keyLight = dir;

  // ── Wide-plank oak floor: per-plank tone and grain
  const oakTexture = canvasTexture(1024, (g, n) => {
    const r = seededRandom(3);
    const rows = 8, plankH = n / rows;
    for (let row = 0; row < rows; row++) {
      let x = -r() * n * 0.5;
      while (x < n) {
        const len = n * (0.45 + r() * 0.5);
        const tone = 0.93 + r() * 0.12;
        g.fillStyle = `rgb(${Math.round(200 * tone)},${Math.round(172 * tone)},${Math.round(138 * tone)})`;
        g.fillRect(x, row * plankH, len, plankH);
        for (let k = 0; k < 14; k++) {
          const yy = row * plankH + r() * plankH;
          g.strokeStyle = `rgba(120,90,60,${0.05 + r() * 0.08})`;
          g.lineWidth = 0.6 + r() * 1.6;
          g.beginPath();
          g.moveTo(x, yy);
          g.bezierCurveTo(x + len * 0.3, yy + (r() - 0.5) * 6, x + len * 0.7, yy + (r() - 0.5) * 6, x + len, yy);
          g.stroke();
        }
        g.fillStyle = 'rgba(90,65,45,0.45)';
        g.fillRect(x, row * plankH, 1.5, plankH);
        x += len;
      }
      g.fillStyle = 'rgba(90,65,45,0.35)';
      g.fillRect(0, row * plankH, n, 1.5);
    }
  });
  oakTexture.repeat.set(12, 12);

  floorMaterial = new THREE.MeshStandardMaterial({
    map: oakTexture,
    roughness: 0.62,
    metalness: 0.0,
  });
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), floorMaterial);
  floor.rotation.x = -Math.PI / 2;
  floor.receiveShadow = true;
  scene.add(floor);
  floorMesh = floor;

  setupCabinetDrag();
  initSnapGuide();
  window.addEventListener('resize', onResize);
  for (const ev of ['pointerdown', 'pointermove', 'pointerup', 'wheel', 'touchstart', 'touchmove', 'touchend']) {
    renderer.domElement.addEventListener(ev, invalidate, { passive: true });
  }
  animate();
  notifyFlutter({ event: 'ready' });
}

// A soft, room-sized light box baked into an environment map: gives every
// material gentle fill light and believable reflections (steel, glass,
// quartz) without extra real-time lights. Skipped if the device can't do it.
function buildEnvironment() {
  try {
    const pmrem = new THREE.PMREMGenerator(renderer);
    const env = new THREE.Scene();
    const shell = new THREE.Mesh(
      new THREE.BoxGeometry(12, 6, 12),
      new THREE.MeshBasicMaterial({ color: 0x9a938a, side: THREE.BackSide })
    );
    shell.position.y = 3;
    env.add(shell);
    const panel = (w, h, pos, rot, rgb) => {
      const m = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: new THREE.Color(...rgb), side: THREE.DoubleSide })
      );
      m.position.set(...pos);
      m.rotation.set(...rot);
      env.add(m);
    };
    panel(7, 4, [0, 5.95, 1], [Math.PI / 2, 0, 0], [2.2, 2.1, 1.95]);      // ceiling
    panel(4, 2.6, [5.95, 2.6, 2], [0, -Math.PI / 2, 0], [4.2, 4.1, 3.9]);  // window side
    panel(5, 2.2, [0, 2.4, 5.95], [0, Math.PI, 0], [1.6, 1.6, 1.65]);      // behind viewer
    panel(3, 2, [-5.95, 2.5, -1], [0, Math.PI / 2, 0], [0.9, 0.95, 1.05]); // cool fill
    scene.environment = pmrem.fromScene(env, 0.04).texture;
    env.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
    pmrem.dispose();
  } catch (e) {
    console.warn('Environment lighting unavailable:', e);
    scene.add(new THREE.AmbientLight(0xfff8f0, 0.6));
  }
}

// Render on demand: a static kitchen doesn't need 60 redraws a second, and
// phones run cooler without them. Anything that changes the scene calls this.
let framesToRender = 2;
function invalidate() { framesToRender = Math.max(framesToRender, 2); }

// ── Wall generation (Grid Cell Box Decomposition) ───────────────────────────
// Divides the wall into a grid of clean BoxGeometry blocks around obstacles.
// 100% eliminates Earcut triangulation bugs, diagonal shadow splits, and door floor glitches.
function buildWall(wallData, obstacles) {
  // Remove any existing wall meshes
  scene.children
    .filter(o => o.userData.isWall || o.userData.isObstacleMarker)
    .forEach(o => {
      scene.remove(o);
      o.geometry?.dispose();
    });

  const W = wallData.width_mm  * MM;
  const H = wallData.height_mm * MM;
  const D = wallData.depth_mm  * MM;
  currentWallDepth = D;

  // Collect unique X and Y grid line coordinates
  const xs = new Set([0, W]);
  const ys = new Set([0, H]);

  obstacles.forEach(obs => {
    const hx = obs.distance_from_left_mm * MM;
    const hy = obs.distance_from_floor_mm * MM;
    const hw = obs.width_mm * MM;
    const hh = obs.height_mm * MM;

    xs.add(Math.max(0, Math.min(W, hx)));
    xs.add(Math.max(0, Math.min(W, hx + hw)));
    ys.add(Math.max(0, Math.min(H, hy)));
    ys.add(Math.max(0, Math.min(H, hy + hh)));
  });

  const xList = Array.from(xs).sort((a, b) => a - b);
  const yList = Array.from(ys).sort((a, b) => a - b);

  const wallGroup = new THREE.Group();
  wallGroup.userData.isWall = true;

  const mat = new THREE.MeshStandardMaterial({
    color: 0xf5f5f0,
    roughness: 0.85,
    metalness: 0.02
  });

  // Build clean rectangular box blocks for solid wall cells
  for (let i = 0; i < xList.length - 1; i++) {
    const x0 = xList[i];
    const x1 = xList[i + 1];
    const cellW = x1 - x0;
    if (cellW <= 0.0001) continue;

    for (let j = 0; j < yList.length - 1; j++) {
      const y0 = yList[j];
      const y1 = yList[j + 1];
      const cellH = y1 - y0;
      if (cellH <= 0.0001) continue;

      const cx = (x0 + x1) / 2;
      const cy = (y0 + y1) / 2;

      // Skip cell if it sits inside any door or window obstacle
      const isHole = obstacles.some(obs => {
        const hx = obs.distance_from_left_mm * MM;
        const hy = obs.distance_from_floor_mm * MM;
        const hw = obs.width_mm * MM;
        const hh = obs.height_mm * MM;
        return cx >= (hx - 0.0001) && cx <= (hx + hw + 0.0001) && cy >= (hy - 0.0001) && cy <= (hy + hh + 0.0001);
      });

      if (!isHole) {
        const geo = new THREE.BoxGeometry(cellW, cellH, D);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        mesh.position.set(x0 + cellW / 2 - W / 2, y0 + cellH / 2, D / 2);
        wallGroup.add(mesh);
      }
    }
  }

  // Multi-Wall Support (L-Shape Return Wall & Galley Second Wall)
  const shape = wallData.shape || 'singleWall';
  const returnMm = wallData.return_mm ? (wallData.return_mm * MM) : 0;
  if (shape === 'lShape' && returnMm > 0) {
    // Sits just outside the measured main-wall width (its inner face is at
    // x = -W/2) and runs from the back of the main wall, so both measured
    // lengths are clear interior space for cabinets.
    const returnGeo = new THREE.BoxGeometry(D, H, D + returnMm);
    const returnMesh = new THREE.Mesh(returnGeo, mat);
    returnMesh.castShadow = true;
    returnMesh.receiveShadow = true;
    returnMesh.position.set(-W / 2 - D / 2, H / 2, (D + returnMm) / 2);
    wallGroup.add(returnMesh);
  } else if (shape === 'galley') {
    const aisleMm = wallData.aisle_mm ? (wallData.aisle_mm * MM) : 1.2;
    const galleyGeo = new THREE.BoxGeometry(W, H, D);
    const galleyMesh = new THREE.Mesh(galleyGeo, mat);
    galleyMesh.castShadow = true;
    galleyMesh.receiveShadow = true;
    galleyMesh.position.set(0, H / 2, D + aisleMm + 0.6 + D / 2);
    wallGroup.add(galleyMesh);
  }

  scene.add(wallGroup);

  // Reframe camera
  currentWallW = W;
  currentWallH = H;
  resetFrontView();

  // Obstacle colour overlays
  obstacles.forEach(obs => addObstacleMarker(obs, W));

  // Restore pre-placed cabinets if loading an existing consultation or draft
  if (Array.isArray(scenePayload.placed_cabinets) && scenePayload.placed_cabinets.length > 0) {
    scenePayload.placed_cabinets.forEach(c => spawnFromEntry(c));
  }

  // Restore style archetype if specified
  if (scenePayload.style_archetype && window.applyStyleArchetype) {
    window.applyStyleArchetype(scenePayload.style_archetype);
  }
}

let currentWallW = 4, currentWallH = 2.7;

window.resetFrontView = function() {
  if (!controls || !camera) return;
  const maxDim = Math.max(currentWallW, currentWallH);
  const dist = Math.max(2.2, maxDim * 1.5);
  controls.target.set(0, currentWallH / 2, currentWallDepth / 2);
  camera.position.set(0, currentWallH / 2 + 0.15, dist);
  controls.update();
  invalidate();
  showToast('View reset');
};

function create3DDoor(hw, hh, D) {
  const group = new THREE.Group();

  const frameThick = 0.05; // 50mm frame thickness
  const frameDepth = D + 0.02; // slight protrusion from wall

  const frameMat = new THREE.MeshStandardMaterial({
    color: 0x3e3832, // modern warm espresso / walnut frame
    roughness: 0.6,
    metalness: 0.1
  });

  const doorMat = new THREE.MeshStandardMaterial({
    color: 0xf4f5f7, // contemporary light architectural door panel
    roughness: 0.45,
    metalness: 0.05
  });

  const handleMat = new THREE.MeshStandardMaterial({
    color: 0xd4af37, // brushed luxury gold handle
    roughness: 0.25,
    metalness: 0.85
  });

  // Top header frame
  const topFrame = new THREE.Mesh(new THREE.BoxGeometry(hw, frameThick, frameDepth), frameMat);
  topFrame.position.set(0, hh / 2 - frameThick / 2, 0);
  topFrame.castShadow = true;
  group.add(topFrame);

  // Left jamb frame
  const leftFrame = new THREE.Mesh(new THREE.BoxGeometry(frameThick, hh - frameThick, frameDepth), frameMat);
  leftFrame.position.set(-hw / 2 + frameThick / 2, -frameThick / 2, 0);
  leftFrame.castShadow = true;
  group.add(leftFrame);

  // Right jamb frame
  const rightFrame = new THREE.Mesh(new THREE.BoxGeometry(frameThick, hh - frameThick, frameDepth), frameMat);
  rightFrame.position.set(hw / 2 - frameThick / 2, -frameThick / 2, 0);
  rightFrame.castShadow = true;
  group.add(rightFrame);

  // Door leaf panel
  const leafW = hw - frameThick * 2;
  const leafH = hh - frameThick;
  const leafD = 0.04;
  const doorLeaf = new THREE.Mesh(new THREE.BoxGeometry(leafW, leafH, leafD), doorMat);
  doorLeaf.position.set(0, -frameThick / 2, 0);
  doorLeaf.castShadow = true;
  doorLeaf.receiveShadow = true;
  group.add(doorLeaf);

  // Architectural recessed panel details on door face
  const panelMargin = 0.06;
  const subPanelH = (leafH - panelMargin * 3) / 2;
  const subPanelW = leafW - panelMargin * 2;
  if (subPanelH > 0.1 && subPanelW > 0.1) {
    [-subPanelH / 2 - panelMargin / 2, subPanelH / 2 + panelMargin / 2].forEach(py => {
      const groove = new THREE.Mesh(
        new THREE.BoxGeometry(subPanelW, subPanelH, 0.005),
        new THREE.MeshStandardMaterial({ color: 0xe5e7eb, roughness: 0.6 })
      );
      groove.position.set(0, py - frameThick / 2, leafD / 2 + 0.002);
      group.add(groove);
    });
  }

  // Lever Handle
  const handleH = Math.min(1.0, hh * 0.48) - (hh / 2);
  const handleX = hw / 2 - frameThick - 0.07;

  const backplate = new THREE.Mesh(new THREE.BoxGeometry(0.035, 0.13, 0.008), handleMat);
  backplate.position.set(handleX, handleH, leafD / 2 + 0.004);
  group.add(backplate);

  const stem = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.025, 12), handleMat);
  stem.rotation.x = Math.PI / 2;
  stem.position.set(handleX, handleH + 0.02, leafD / 2 + 0.02);
  group.add(stem);

  const lever = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.015, 0.015), handleMat);
  lever.position.set(handleX - 0.04, handleH + 0.02, leafD / 2 + 0.03);
  group.add(lever);

  return group;
}

function create3DWindow(hw, hh, D) {
  const group = new THREE.Group();

  const frameThick = 0.045; // 45mm window frame thickness
  const frameDepth = D + 0.02;

  const frameMat = new THREE.MeshStandardMaterial({
    color: 0x22262f, // modern anthracite aluminum window frame
    roughness: 0.4,
    metalness: 0.3
  });

  const sillMat = new THREE.MeshStandardMaterial({
    color: 0xf0f0f5, // marble / stone window ledge
    roughness: 0.3,
    metalness: 0.1
  });

  const glassMat = new THREE.MeshPhysicalMaterial({
    color: 0x90cdf4, // sky blue transparent reflective glass
    transparent: true,
    opacity: 0.35,
    roughness: 0.05,
    metalness: 0.1,
    transmission: 0.7,
    ior: 1.5,
    reflectivity: 0.5,
    side: THREE.DoubleSide
  });

  // Top frame
  const topF = new THREE.Mesh(new THREE.BoxGeometry(hw, frameThick, frameDepth), frameMat);
  topF.position.set(0, hh / 2 - frameThick / 2, 0);
  topF.castShadow = true;
  group.add(topF);

  // Bottom frame
  const botF = new THREE.Mesh(new THREE.BoxGeometry(hw, frameThick, frameDepth), frameMat);
  botF.position.set(0, -hh / 2 + frameThick / 2, 0);
  botF.castShadow = true;
  group.add(botF);

  // Left frame
  const leftF = new THREE.Mesh(new THREE.BoxGeometry(frameThick, hh - frameThick * 2, frameDepth), frameMat);
  leftF.position.set(-hw / 2 + frameThick / 2, 0, 0);
  leftF.castShadow = true;
  group.add(leftF);

  // Right frame
  const rightF = new THREE.Mesh(new THREE.BoxGeometry(frameThick, hh - frameThick * 2, frameDepth), frameMat);
  rightF.position.set(hw / 2 - frameThick / 2, 0, 0);
  rightF.castShadow = true;
  group.add(rightF);

  // Center vertical mullion
  const mullion = new THREE.Mesh(new THREE.BoxGeometry(frameThick * 0.75, hh - frameThick * 2, frameDepth * 0.8), frameMat);
  mullion.position.set(0, 0, 0);
  group.add(mullion);

  // Center horizontal transom (if window is tall enough > 0.8m)
  if (hh > 0.8) {
    const transom = new THREE.Mesh(new THREE.BoxGeometry(hw - frameThick * 2, frameThick * 0.75, frameDepth * 0.8), frameMat);
    transom.position.set(0, 0, 0);
    group.add(transom);
  }

  // Glass Pane
  const glass = new THREE.Mesh(new THREE.BoxGeometry(hw - frameThick * 2, hh - frameThick * 2, 0.008), glassMat);
  glass.position.set(0, 0, 0);
  group.add(glass);

  // Protruding Window Sill / Ledge at bottom
  const sill = new THREE.Mesh(
    new THREE.BoxGeometry(hw + 0.08, 0.03, frameDepth + 0.06),
    sillMat
  );
  sill.position.set(0, -hh / 2 - 0.015, 0.02);
  sill.castShadow = true;
  sill.receiveShadow = true;
  group.add(sill);

  return group;
}

function addObstacleMarker(obs, wallWidth) {
  const hx = (obs.distance_from_left_mm * MM) - (wallWidth / 2);
  const hy = obs.distance_from_floor_mm * MM;
  const hw = obs.width_mm * MM;
  const hh = obs.height_mm * MM;

  let model;
  if (obs.type === 'door') {
    model = create3DDoor(hw, hh, currentWallDepth);
  } else {
    model = create3DWindow(hw, hh, currentWallDepth);
  }

  model.position.set(hx + hw / 2, hy + hh / 2, currentWallDepth / 2);
  model.userData.isObstacleMarker = true;
  scene.add(model);
}

const TEX = {};
const MAT = {};
let WOOD_TILE = 0.6;  // metres of front per texture repeat
let STONE_TILE = 1.2;

// ── Finish textures ──────────────────────────────────────────────────────────
// Photographs (or stand-ins made by tool/gen_finish_textures.py) of the real
// finishes: a colour map, and where the finish has relief or uneven gloss a
// normal map and a roughness map. The app sends them after the page loads
// (registerFinishTextures, then registerFinishFile for each file, then
// finishTexturesReady), as data URLs, so they work offline. Without them the
// page falls back on the textures it draws itself.
const FINISH = { manifest: null, files: {}, cache: {}, loading: 0, waiting: [] };

window.registerFinishTextures = function(manifest) {
  try { FINISH.manifest = typeof manifest === 'string' ? JSON.parse(manifest) : manifest; } catch (e) { return; }
  // One tile size per kind keeps every cabinet's grain the same scale.
  const sizes = Object.values(FINISH.manifest.textures || {});
  const wood = sizes.find(t => t.kind === 'wood'), stone = sizes.find(t => t.kind === 'stone');
  if (wood) WOOD_TILE = wood.tile_m;
  if (stone) STONE_TILE = stone.tile_m;
};
window.registerFinishFile = function(name, dataUrl) { FINISH.files[name] = dataUrl; };
window.finishTexturesReady = function() {
  applyFinishTextures();
};

// A texture from a registered file, loading in the background. Null if the
// file never arrived.
function finishMap(file, { color = false, normal = false } = {}) {
  if (!file || !FINISH.files[file]) return null;
  if (FINISH.cache[file]) return FINISH.cache[file];
  const tex = new THREE.Texture();
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  if (color && THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  FINISH.cache[file] = tex;
  FINISH.loading++;
  const img = new Image();
  const done = () => {
    FINISH.loading--;
    if (FINISH.loading === 0) {
      // Everything asked for has arrived: put it on the materials.
      applyFinishTextures();
      FINISH.waiting.splice(0).forEach(fn => fn());
    }
    invalidate();
  };
  img.onload = () => { tex.image = img; tex.needsUpdate = true; done(); };
  img.onerror = () => { delete FINISH.cache[file]; done(); };
  img.src = FINISH.files[file];
  return tex;
}

// Runs [fn] when every texture asked for so far has finished decoding.
function whenTexturesSettled(fn) {
  if (FINISH.loading === 0) fn(); else FINISH.waiting.push(fn);
}

// The maps of one texture id, or null.
function finishSet(id) {
  const t = FINISH.manifest && FINISH.manifest.textures && FINISH.manifest.textures[id];
  if (!t) return null;
  // Ask for all three maps at once; use the set once the colour has decoded
  // (a texture with no image yet would show black).
  const map = finishMap(t.albedo, { color: true });
  const normalMap = finishMap(t.normal), roughnessMap = finishMap(t.roughness);
  if (!map || !map.image) return null;
  return {
    map,
    normalMap: normalMap && normalMap.image ? normalMap : null,
    roughnessMap: roughnessMap && roughnessMap.image ? roughnessMap : null,
    tile: t.tile_m,
    tileH: t.tile_h_m,
    kind: t.kind,
  };
}

// The close-up look of a matte painted or laminate front: faint relief and
// uneven gloss, used with a flat colour.
function microSet() {
  const m = FINISH.manifest && FINISH.manifest.micro;
  if (!m) return null;
  const normalMap = finishMap(m.normal), roughnessMap = finishMap(m.roughness);
  if (!normalMap || !normalMap.image) return null;
  return { normalMap, roughnessMap: roughnessMap && roughnessMap.image ? roughnessMap : null };
}

function seededRandom(seed) {
  let s = seed;
  return () => (s = (s * 16807) % 2147483647) / 2147483647;
}

function canvasTexture(size, draw) {
  const c = document.createElement('canvas');
  c.width = c.height = size;
  draw(c.getContext('2d'), size);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
  return t;
}

// Light grey grain (tinted by the material colour), running vertically.
function woodTexture() {
  return canvasTexture(512, (g, n) => {
    const r = seededRandom(7);
    g.fillStyle = '#ebebeb';
    g.fillRect(0, 0, n, n);
    for (let i = 0; i < 170; i++) {
      const x = r() * n, phase = r() * 6.28, amp = 2 + r() * 6;
      const shade = Math.round(175 + r() * 70);
      g.strokeStyle = `rgba(${shade},${shade},${shade},${0.25 + r() * 0.35})`;
      g.lineWidth = 0.6 + r() * 2.4;
      g.beginPath();
      for (let y = -8; y <= n + 8; y += 16) {
        const xx = x + Math.sin(y * 0.012 + phase) * amp;
        if (y < 0) g.moveTo(xx, y); else g.lineTo(xx, y);
      }
      g.stroke();
    }
  });
}

// White stone with soft grey veins and a fine speckle (tinted per style).
function stoneTexture() {
  return canvasTexture(512, (g, n) => {
    const r = seededRandom(11);
    g.fillStyle = '#f2f2f2';
    g.fillRect(0, 0, n, n);
    for (let i = 0; i < 3500; i++) {
      const v = Math.round(150 + r() * 90);
      g.fillStyle = `rgba(${v},${v},${v},0.12)`;
      g.fillRect(r() * n, r() * n, 1.4, 1.4);
    }
    for (let i = 0; i < 5; i++) {
      const pts = [[r() * n, -20], [r() * n, n * 0.35], [r() * n, n * 0.7], [r() * n, n + 20]];
      for (const [width, alpha] of [[10, 0.035], [4, 0.06], [1.2, 0.1]]) {
        g.strokeStyle = `rgba(140,140,140,${alpha})`;
        g.lineWidth = width;
        g.beginPath();
        g.moveTo(pts[0][0], pts[0][1]);
        g.bezierCurveTo(pts[1][0], pts[1][1], pts[2][0], pts[2][1], pts[3][0], pts[3][1]);
        g.stroke();
      }
    }
  });
}

function initMaterials() {
  TEX.wood = woodTexture();
  TEX.stone = stoneTexture();
  const std = o => new THREE.MeshStandardMaterial(o);
  MAT.base = std({ metalness: 0.02 });
  MAT.wall = std({ metalness: 0.02 });
  MAT.tall = std({ metalness: 0.02 });
  MAT.top = new THREE.MeshPhysicalMaterial({ map: TEX.stone, metalness: 0.0, clearcoat: 0.3, clearcoatRoughness: 0.14 });
  MAT.handle = std({});
  MAT.plinth = std({ roughness: 0.9 });
  MAT.reveal = std({ color: 0x14120f, roughness: 1 });
  MAT.steel = std({ color: 0xcfd2d6, metalness: 0.9, roughness: 0.28 });
  MAT.basin = std({ color: 0xd3d6da, metalness: 0.55, roughness: 0.38, side: THREE.BackSide });
  MAT.glass = std({ color: 0x0b0b0d, metalness: 0.2, roughness: 0.06 });
  MAT.burner = std({ color: 0x55575b, metalness: 0.4, roughness: 0.55 });
  MAT.led = new THREE.MeshBasicMaterial({ color: 0xfff0d2 });
  applyFinishMaterials(STYLE_FINISHES[currentArchetypeId] || STYLE_FINISHES.japandi);
}

function setFront(mat, f) {
  const set = f.tex && finishSet(f.tex);
  if (set) {
    // A real finish: its own colours, relief and gloss.
    mat.color.setHex(0xffffff);
    mat.map = set.map;
    mat.normalMap = set.normalMap;
    mat.normalScale.set(0.8, 0.8);
    mat.roughnessMap = set.roughnessMap;
    mat.roughness = set.roughnessMap ? 1 : f.roughness;
  } else {
    // Painted or laminate: a flat colour with a faint micro texture.
    const micro = microSet();
    mat.color.setHex(f.color);
    mat.map = !FINISH.manifest && f.wood ? TEX.wood : null;
    mat.normalMap = micro ? micro.normalMap : null;
    mat.normalScale.set(0.08, 0.08);
    mat.roughnessMap = micro ? micro.roughnessMap : null;
    mat.roughness = micro && micro.roughnessMap ? Math.min(1, f.roughness / 0.62) : f.roughness;
  }
  mat.needsUpdate = true;
}

// Worktop looks chosen as a benchtop (the keys of the catalogue's benchtop
// options); anything else keeps the style's own worktop.
const BENCHTOP_LOOKS = {
  quartz_calacatta: { tex: 'calacatta', color: 0xffffff, roughness: 0.18 },
  granite_black: { tex: 'granite_black', color: 0xffffff, roughness: 0.2 },
  laminate_matte: { tex: null, color: 0xd9d5cc, roughness: 0.72 },
};
let benchtopKey = null;

function applyTop(fin) {
  const look = benchtopKey && BENCHTOP_LOOKS[benchtopKey];
  const spec = look || fin.top;
  const set = spec.tex && finishSet(spec.tex);
  const top = MAT.top;
  if (set) {
    top.color.setHex(0xffffff);
    top.map = set.map;
    top.normalMap = set.normalMap;
    top.normalScale.set(0.7, 0.7);
    top.roughnessMap = set.roughnessMap;
    // The roughness map holds the real gloss; polished stone also gets a clear coat.
    top.roughness = set.roughnessMap ? 1 : spec.roughness;
    top.clearcoat = spec.roughness < 0.3 ? 0.35 : 0.08;
  } else {
    const micro = look ? microSet() : null;
    top.color.setHex(spec.color);
    top.map = look ? null : TEX.stone;
    top.normalMap = micro ? micro.normalMap : null;
    top.normalScale.set(0.06, 0.06);
    top.roughnessMap = micro ? micro.roughnessMap : null;
    top.roughness = micro && micro.roughnessMap ? Math.min(1, spec.roughness / 0.62) : spec.roughness;
    top.clearcoat = look ? 0 : 0.3;
  }
  top.needsUpdate = true;
}

function applyFinishMaterials(fin) {
  setFront(MAT.base, fin.base);
  setFront(MAT.wall, fin.wall);
  setFront(MAT.tall, fin.tall);
  applyTop(fin);
  MAT.handle.color.setHex(fin.handle.color);
  MAT.handle.metalness = fin.handle.metalness;
  MAT.handle.roughness = fin.handle.roughness;
  MAT.plinth.color.setHex(fin.plinth);
}

// The floor of the room: wide planks, once their textures have arrived.
let floorMaterial = null, floorMesh = null;
function applyFloorTextures() {
  if (!floorMaterial) return;
  const set = finishSet('floor_oak');
  if (!set) return;
  floorMaterial.map = set.map;
  floorMaterial.normalMap = set.normalMap;
  floorMaterial.normalScale.set(0.6, 0.6);
  floorMaterial.roughnessMap = set.roughnessMap;
  floorMaterial.roughness = 1;
  for (const t of [set.map, set.normalMap, set.roughnessMap]) if (t) t.repeat.set(30 / set.tile, 30 / set.tile);
  floorMaterial.needsUpdate = true;
}

// Called when the textures have been handed over, and on a style change.
function applyFinishTextures() {
  applyFinishMaterials(currentFinish());
  applyFloorTextures();
  invalidate();
}

window.setBenchtop = function(key) {
  benchtopKey = (typeof key === 'string' && BENCHTOP_LOOKS[key]) ? key : null;
  applyTop(currentFinish());
  invalidate();
};

function currentFinish() {
  return STYLE_FINISHES[currentArchetypeId] || STYLE_FINISHES.japandi;
}

// Box whose UVs are in metres / tile, so grain and veins keep the same scale
// on every panel size. Each box gets a different offset so neighbouring doors
// don't show the identical pattern.
let uvSeed = 0;
function boxGeo(w, h, d, tile) {
  const g = new THREE.BoxGeometry(w, h, d);
  if (!tile) return g;
  const uv = g.attributes.uv;
  const offset = ((uvSeed * 0.6180339) % 1);
  const offsetV = ((uvSeed++ * 0.7548777) % 1);
  const dims = [[d, h], [d, h], [w, d], [w, d], [w, h], [w, h]]; // +x −x +y −y +z −z
  for (let f = 0; f < 6; f++) {
    for (let k = 0; k < 4; k++) {
      const i = f * 4 + k;
      uv.setXY(i, uv.getX(i) * dims[f][0] / tile + offset, uv.getY(i) * dims[f][1] / tile + offsetV);
    }
  }
  return g;
}

// ── Style Archetype Applicator ─────────────────────────────────────────────
window.applyStyleArchetype = function(archetypeId) {
  const style = STYLE_ARCHETYPES[archetypeId];
  if (!style) return;
  currentArchetypeId = archetypeId;

  // 1. Walls
  scene.traverse(child => {
    if (child.parent && child.parent.userData && child.parent.userData.isWall && child.isMesh) {
      child.material.color.setHex(style.wallColor);
      child.material.roughness = 0.85;
      child.material.needsUpdate = true;
    }
  });

  // 2. Shared cabinet materials, then rebuild handles for the new style
  applyFinishMaterials(currentFinish());
  placedCabinets.forEach(rebuildCabinet);
  if (selectedCabinet && selectionBox) selectionBox.setFromObject(selectedCabinet);
  invalidate();

  showToast(`Style: ${style.name}`);
  notifyFlutter({
    event: 'style_applied',
    archetype: archetypeId,
    name: style.name,
    multiplier: style.multiplier,
  });
};

// ── Cabinet construction ───────────────────────────────────────────────────
// One builder for manual, restored and generated cabinets. A cabinet group is
// centred on its bounding box (w × h × d) with its back against the wall at
// local z = −d/2 and its front facing +z. All meshes are direct children so
// getHit() can map a hit back to its cabinet.
const PLINTH_H = 0.1;   // toe-kick height
const PLINTH_SET = 0.06; // toe-kick recess
const FRONT_T = 0.018;  // door / drawer front thickness
const GAP = 0.003;      // reveal between fronts
const TOP_T = 0.04;     // worktop thickness
const TOP_OVER = 0.02;  // worktop front overhang
const ARM_D = 0.6;      // L-corner arm depth (base cabinet depth)
const KIND_OF_TYPE = {
  base_800: 'base', base_600: 'base', wall_600: 'wall', tall_600: 'tall', corner_900: 'corner',
  sink_600: 'sink', cooktop_600: 'hob', dishwasher_600: 'dishwasher',
  oven_tower_600: 'oven', fridge_recess_700: 'fridge', rangehood_900: 'hood',
};
// Full-height units: no worktop, tall-cabinet finish.
const TALL_KINDS = new Set(['tall', 'oven', 'fridge']);

// The catalogue (prices and sizes live on the office server and are edited in
// the Studio) is the source of module sizes. Flutter sends the modules it is
// pricing with; the specs above are what the page falls back on without it.
// Merged, not replaced: a spec keeps flags the catalogue doesn't carry (the
// cooktop's `hood: false`).
window.setCatalogModules = function(json) {
  let modules;
  try { modules = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return; }
  if (!Array.isArray(modules)) return;
  for (const m of modules) {
    if (!m || !m.type || !(m.width_mm > 0) || !(m.height_mm > 0) || !(m.depth_mm > 0)) continue;
    const mount = Math.max(0, m.mount_mm || 0);
    CABINET_SPECS[m.type] = {
      ...(CABINET_SPECS[m.type] || {}),
      w: m.width_mm * MM, h: m.height_mm * MM, d: m.depth_mm * MM,
      isWall: mount > 0, mountH: mount * MM,
      label: m.label || m.type,
    };
    if (m.kind) KIND_OF_TYPE[m.type] = m.kind;
  }
};

function specFromEntry(c) {
  const known = CABINET_SPECS[c.cabinet_type];
  if (!c.generated && known) return { ...known, kind: KIND_OF_TYPE[c.cabinet_type] || 'base' };
  return {
    w: c.width_mm * MM, h: c.height_mm * MM, d: c.depth_mm * MM,
    isWall: (c.mount_mm || 0) > 0, mountH: (c.mount_mm || 0) * MM,
    label: c.label || c.cabinet_type, kind: c.kind || 'base',
  };
}

function frontMaterial(spec) {
  if (spec.isWall) return MAT.wall;
  return TALL_KINDS.has(spec.kind) ? MAT.tall : MAT.base;
}

function buildCabinetParts(group, spec) {
  const { w, h, d, kind, isWall } = spec;
  const fm = frontMaterial(spec);
  const add = (geo, mat, x, y, z, cast = true) => {
    const m = new THREE.Mesh(geo, mat);
    m.position.set(x, y, z);
    m.castShadow = cast;
    m.receiveShadow = true;
    group.add(m);
    return m;
  };
  const bottom = -h / 2;
  const front = d / 2;
  const topY = h / 2 + TOP_T / 2;

  if (kind === 'filler') {
    if (isWall) {
      add(boxGeo(w, h, d, WOOD_TILE), fm, 0, 0, 0);
    } else {
      add(boxGeo(w, PLINTH_H, d - PLINTH_SET), MAT.plinth, 0, bottom + PLINTH_H / 2, -PLINTH_SET / 2);
      add(boxGeo(w, h - PLINTH_H, d, WOOD_TILE), fm, 0, bottom + PLINTH_H + (h - PLINTH_H) / 2, 0);
      add(boxGeo(w, TOP_T, d + TOP_OVER, STONE_TILE), MAT.top, 0, topY, TOP_OVER / 2);
    }
    return;
  }

  if (kind === 'corner') return buildCornerParts(group, spec, add);
  if (kind === 'hood') return buildRangehood(spec, add);

  const y0 = isWall ? bottom : bottom + PLINTH_H; // carcass bottom
  const bodyH = h / 2 - y0;
  const midY = y0 + bodyH / 2;

  if (!isWall) add(boxGeo(w, PLINTH_H, d - PLINTH_SET), MAT.plinth, 0, bottom + PLINTH_H / 2, -PLINTH_SET / 2);

  // Carcass. The sink unit is open-topped so the basin can drop into it.
  const carcD = d - FRONT_T;
  const carcZ = -FRONT_T / 2;
  if (kind === 'sink') {
    const p = 0.018;
    add(boxGeo(p, bodyH, carcD, WOOD_TILE), fm, -w / 2 + p / 2, midY, carcZ);
    add(boxGeo(p, bodyH, carcD, WOOD_TILE), fm, w / 2 - p / 2, midY, carcZ);
    add(boxGeo(w - 2 * p, bodyH, p), fm, 0, midY, -d / 2 + p / 2);
    add(boxGeo(w - 2 * p, p, carcD), fm, 0, y0 + p / 2, carcZ);
  } else {
    add(boxGeo(w, bodyH, carcD, WOOD_TILE), fm, 0, midY, carcZ);
  }
  // Dark backing so the 3 mm gaps between fronts read as shadow lines.
  add(new THREE.PlaneGeometry(w - 0.004, bodyH - 0.004), MAT.reveal, 0, midY, front - FRONT_T + 0.0008, false);

  // Fronts
  const x0 = -w / 2, x1 = w / 2, yTop = h / 2;
  const pair = w >= 0.5;
  const doors = (ya, yb, at, long) => pair
    ? [[x0, 0, ya, yb, { side: 'right', at, long }], [0, x1, ya, yb, { side: 'left', at, long }]]
    : [[x0, x1, ya, yb, { side: 'right', at, long }]];
  let fronts;
  if (kind === 'drawer' || kind === 'hob') {
    const hs = [0.22, 0.36, 0.42].map(f => f * bodyH);
    fronts = [
      [x0, x1, yTop - hs[0], yTop, { drawer: true }],
      [x0, x1, yTop - hs[0] - hs[1], yTop - hs[0], { drawer: true }],
      [x0, x1, y0, yTop - hs[0] - hs[1], { drawer: true }],
    ];
  } else if (kind === 'tall') {
    const split = y0 + bodyH * 0.6;
    fronts = [...doors(y0, split, 'top', true), ...doors(split, yTop, 'bottom', false)];
  } else if (kind === 'dishwasher') {
    // Integrated: one full-height panel in the cabinet finish, pull along the top.
    fronts = [[x0, x1, y0, yTop, { drawer: true }]];
  } else if (kind === 'oven') {
    // Drawer, oven at eye level, compact oven/microwave above, door to the top.
    const ovenB = bottom + 0.80, ovenT = ovenB + 0.60, microT = ovenT + 0.40;
    fronts = [
      [x0, x1, y0, ovenB, { drawer: true }],
      [x0, x1, ovenB, ovenT, { appliance: 'oven' }],
      [x0, x1, ovenT, microT, { appliance: 'oven' }],
      ...doors(microT, yTop, 'bottom', false),
    ];
  } else if (kind === 'fridge') {
    // Stainless fridge (freezer below) in a recess, cabinet above.
    const fridgeT = bottom + 1.80;
    const freezerT = y0 + (fridgeT - y0) * 0.36;
    fronts = [
      [x0, x1, y0, freezerT, { appliance: 'fridge', at: 'top' }],
      [x0, x1, freezerT, fridgeT, { appliance: 'fridge', at: 'bottom' }],
      ...doors(fridgeT, yTop, 'bottom', false),
    ];
  } else {
    fronts = doors(y0, yTop, isWall ? 'bottom' : 'top', false);
  }
  for (const [a, b, ya, yb, handle] of fronts) {
    if (handle.appliance) {
      buildApplianceFront(add, handle, (a + b) / 2, (ya + yb) / 2, b - a - GAP, yb - ya - GAP, front);
      continue;
    }
    addFrontPanel(add, fm, (a + b) / 2, (ya + yb) / 2, b - a - GAP, yb - ya - GAP, front - FRONT_T / 2);
    addHandle(add, a + GAP / 2, b - GAP / 2, ya + GAP / 2, yb - GAP / 2, front, handle, isWall);
  }

  // Worktop + appliances
  if (!isWall && !TALL_KINDS.has(kind)) {
    if (kind === 'sink') buildSinkTop(spec, add);
    else add(boxGeo(w, TOP_T, d + TOP_OVER, STONE_TILE), MAT.top, 0, topY, TOP_OVER / 2);
    if (kind === 'hob') buildHob(spec, add);
  }

  // Warm LED strip under wall cabinets
  if (isWall) add(boxGeo(w - 0.04, 0.006, 0.016), MAT.led, 0, bottom - 0.003, front - 0.05, false);

  // A cornice along the top of framed wall units.
  if (isWall && doorStyle !== 'slab') {
    add(boxGeo(w + 0.012, 0.03, 0.03, WOOD_TILE), fm, 0, h / 2 + 0.015, front - 0.005);
    add(boxGeo(w + 0.03, 0.022, 0.05, WOOD_TILE), fm, 0, h / 2 + 0.041, front - 0.015);
  }
}

// ── Backsplash ───────────────────────────────────────────────────────────────
// Tile on the wall between the worktop and the wall units, wherever there are
// base units: it follows the cabinets (and stops at a window), so it is
// rebuilt when they change. 'none' leaves the bare wall.
const BACKSPLASHES = { subway: 'tile_subway', hex: 'tile_hex' };
let backsplashKind = 'subway';
let backsplashGroup = null, backsplashSignature = '';
const backsplashMaterials = {};

function backsplashMaterial(kind) {
  let m = backsplashMaterials[kind];
  if (!m) m = backsplashMaterials[kind] = new THREE.MeshPhysicalMaterial({ color: 0xf1f0ec, roughness: 0.2, clearcoat: 0.4, clearcoatRoughness: 0.1 });
  const set = finishSet(BACKSPLASHES[kind]);
  if (set && m.map !== set.map) {
    m.color.setHex(0xffffff);
    m.map = set.map;
    m.normalMap = set.normalMap;
    m.normalScale.set(0.9, 0.9);
    m.roughnessMap = set.roughnessMap;
    m.roughness = 1;
    m.userData.tile = [set.tile, set.tileH || set.tile];
    m.needsUpdate = true;
  }
  return m;
}

// The stretches of wall to tile: [along-wall start, end] for the main wall
// (scene x) and the side wall of an L (scene z), from the base units' extents.
function backsplashRuns() {
  const main = [], side = [];
  for (const c of placedCabinets) {
    const spec = c.userData.spec;
    if (!spec || spec.isWall || TALL_KINDS.has(spec.kind)) continue;
    if (c.userData.run === 'return') {
      const z = c.position.z;
      side.push([z - spec.w / 2, z + spec.w / 2]);
    } else {
      main.push([c.position.x - spec.w / 2, c.position.x + spec.w / 2]);
    }
  }
  const merge = list => {
    list.sort((a, b) => a[0] - b[0]);
    const out = [];
    for (const r of list) {
      if (out.length && r[0] <= out[out.length - 1][1] + 0.002) out[out.length - 1][1] = Math.max(out[out.length - 1][1], r[1]);
      else out.push([r[0], r[1]]);
    }
    return out;
  };
  return { main: merge(main), side: merge(side) };
}

// Cuts [lo, hi] spans out of [a, b] intervals.
function cutSpans(runs, cuts) {
  let out = runs;
  for (const [lo, hi] of cuts) {
    out = out.flatMap(([a, b]) => (hi <= a || lo >= b) ? [[a, b]] : [[a, Math.min(b, lo)], [Math.max(a, hi), b]].filter(([x, y]) => y - x > 0.02));
  }
  return out;
}

function updateBacksplash(force) {
  const sig = backsplashKind + '|' + currentWallW + '|' + placedCabinets.map(c => `${c.userData.id}:${c.position.x.toFixed(3)}:${c.position.z.toFixed(3)}:${c.userData.run}:${c.userData.spec && c.userData.spec.w}`).join(',') + '|' + FINISH.loading + '|' + (finishSet(BACKSPLASHES[backsplashKind] || '') ? 1 : 0);
  if (!force && sig === backsplashSignature) return;
  backsplashSignature = sig;
  if (backsplashGroup) {
    scene.remove(backsplashGroup);
    backsplashGroup.traverse(o => o.geometry && o.geometry.dispose());
    backsplashGroup = null;
  }
  if (!BACKSPLASHES[backsplashKind] || placedCabinets.length === 0) return;
  const mat = backsplashMaterial(backsplashKind);
  const [tileW, tileH] = mat.userData.tile || [0.6, 0.6];
  const y0 = 0.89, y1 = (CABINET_SPECS.wall_600 && CABINET_SPECS.wall_600.mountH) || 1.4;
  const { main, side } = backsplashRuns();
  // Windows that reach into the tiled band break the run.
  const cuts = ((scenePayload.obstacles || []).filter(o => o.type === 'window' &&
    o.distance_from_floor_mm * MM < y1 && (o.distance_from_floor_mm + o.height_mm) * MM > y0)
    .map(o => [o.distance_from_left_mm * MM - currentWallW / 2, (o.distance_from_left_mm + o.width_mm) * MM - currentWallW / 2]));
  const group = new THREE.Group();
  const strip = (len, onWall) => {
    const g = new THREE.PlaneGeometry(len, y1 - y0);
    const uv = g.attributes.uv;
    for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * len / tileW, uv.getY(i) * (y1 - y0) / tileH);
    const mesh = new THREE.Mesh(g, mat);
    mesh.receiveShadow = true;
    mesh.userData.isBacksplash = true;
    onWall(mesh);
    group.add(mesh);
  };
  for (const [a, b] of cutSpans(main, cuts)) {
    strip(b - a, m => m.position.set((a + b) / 2, (y0 + y1) / 2, currentWallDepth + 0.0015));
  }
  if (side.length) {
    for (const [a, b] of side) {
      strip(b - a, m => { m.rotation.y = Math.PI / 2; m.position.set(-currentWallW / 2 + 0.0015, (y0 + y1) / 2, (a + b) / 2); });
    }
  }
  backsplashGroup = group;
  scene.add(group);
}

window.setBacksplash = function(kind) {
  backsplashKind = BACKSPLASHES[kind] ? kind : 'none';
  updateBacksplash(true);
  invalidate();
};

// ── Decor ────────────────────────────────────────────────────────────────────
// Everyday things on the worktops (plates, jars, a plant, a chopping board…)
// so a picture looks lived in. They are drawn from simple shapes, are not
// cabinets (nothing selects them, nothing prices them) and are NOT part of
// what is sold: the quote says so when they are shown.
let decorOn = true;
let decorGroup = null, decorSignature = '';
const decorMaterials = {};
function decorMat(name) {
  if (decorMaterials[name]) return decorMaterials[name];
  const phys = o => new THREE.MeshPhysicalMaterial(o);
  const table = {
    ceramic: () => phys({ color: 0xf3efe7, roughness: 0.32, clearcoat: 0.4 }),
    stone: () => phys({ color: 0xb9b2a6, roughness: 0.6 }),
    terracotta: () => phys({ color: 0xb4663f, roughness: 0.85 }),
    soil: () => phys({ color: 0x2b2219, roughness: 1 }),
    leaf: () => phys({ color: 0x4a7d3e, roughness: 0.7, side: THREE.DoubleSide }),
    leafDark: () => phys({ color: 0x2f5e30, roughness: 0.7, side: THREE.DoubleSide }),
    glass: () => phys({ color: 0xdce8ec, roughness: 0.06, transparent: true, opacity: 0.32, depthWrite: false }),
    beans: () => phys({ color: 0x3d2a1e, roughness: 0.9 }),
    steel: () => phys({ color: 0xc9ccd0, roughness: 0.22, metalness: 0.9 }),
    black: () => phys({ color: 0x1c1b1a, roughness: 0.5 }),
    wood: () => phys({ color: 0xc89a62, roughness: 0.6 }),
    woodDark: () => phys({ color: 0x6b4a30, roughness: 0.6 }),
    apple: () => phys({ color: 0xb3261e, roughness: 0.4, clearcoat: 0.5 }),
    lemon: () => phys({ color: 0xe6c229, roughness: 0.5 }),
    lime: () => phys({ color: 0x7aa33a, roughness: 0.5 }),
    orange: () => phys({ color: 0xe07b1a, roughness: 0.5 }),
  };
  return (decorMaterials[name] = table[name]());
}

function decorMesh(geo, mat, x, y, z, rot) {
  const m = new THREE.Mesh(geo, decorMat(mat));
  m.position.set(x, y, z);
  if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
  m.castShadow = true;
  m.receiveShadow = true;
  return m;
}

// A thin shell of revolution from [radius, height] points (outer wall, then back down the inner wall).
function lathe(points, segments = 28) {
  return new THREE.LatheGeometry(points.map(([r, y]) => new THREE.Vector2(r, y)), segments);
}

const PROPS = {
  plates() {
    const g = new THREE.Group();
    for (let i = 0; i < 5; i++) g.add(decorMesh(lathe([[0.07, i * 0.016], [0.125, i * 0.016 + 0.014], [0.12, i * 0.016 + 0.016], [0.07, i * 0.016 + 0.003]]), 'ceramic', 0, 0.002, 0));
    return g;
  },
  bowl() {
    const g = new THREE.Group();
    g.add(decorMesh(lathe([[0, 0], [0.045, 0], [0.095, 0.03], [0.13, 0.085], [0.125, 0.088], [0.09, 0.04], [0, 0.012]]), 'stone', 0, 0, 0));
    const fruit = [['apple', 0.045, -0.04, 0.0], ['lemon', 0.04, 0.035, -0.02], ['orange', 0.045, 0.0, 0.04], ['lime', 0.035, 0.05, 0.04], ['apple', 0.04, -0.03, 0.05]];
    for (const [mat, r, x, z] of fruit) g.add(decorMesh(new THREE.SphereGeometry(r, 18, 14), mat, x, 0.05 + r * 0.6, z));
    return g;
  },
  jars() {
    const g = new THREE.Group();
    [[-0.075, 0.2, 0.05], [0, 0.16, 0.05], [0.075, 0.12, 0.045]].forEach(([x, h, r], i) => {
      g.add(decorMesh(new THREE.CylinderGeometry(r, r, h, 24), 'glass', x, h / 2, 0));
      g.add(decorMesh(new THREE.CylinderGeometry(r * 0.88, r * 0.88, h * 0.62, 20), i === 1 ? 'ceramic' : 'beans', x, h * 0.31 + 0.003, 0));
      g.add(decorMesh(new THREE.CylinderGeometry(r * 1.02, r * 1.02, 0.022, 24), 'steel', x, h + 0.011, 0));
    });
    return g;
  },
  plant() {
    const g = new THREE.Group();
    g.add(decorMesh(new THREE.CylinderGeometry(0.07, 0.055, 0.12, 24), 'terracotta', 0, 0.06, 0));
    g.add(decorMesh(new THREE.CylinderGeometry(0.066, 0.066, 0.01, 24), 'soil', 0, 0.118, 0));
    const leaf = new THREE.SphereGeometry(1, 10, 8);
    for (let i = 0; i < 9; i++) {
      const a = i / 9 * Math.PI * 2, tilt = 0.25 + 0.5 * ((i * 37) % 10) / 10, len = 0.14 + 0.1 * (((i * 53) % 10) / 10);
      const m = decorMesh(leaf, i % 2 ? 'leaf' : 'leafDark', Math.cos(a) * 0.03, 0.12 + len * 0.45, Math.sin(a) * 0.03);
      m.scale.set(0.022, len * 0.5, 0.008);
      m.rotation.set(Math.sin(a) * tilt, a, -Math.cos(a) * tilt);
      g.add(m);
    }
    return g;
  },
  board() {
    const g = new THREE.Group();
    const b = decorMesh(new THREE.BoxGeometry(0.34, 0.2, 0.02), 'wood', 0, 0.1, 0, [-0.3, 0, 0]);
    g.add(b);
    g.add(decorMesh(new THREE.CylinderGeometry(0.014, 0.014, 0.022, 14), 'woodDark', 0, 0.17, 0.012, [Math.PI / 2 - 0.3, 0, 0]));
    return g;
  },
  crock() {
    const g = new THREE.Group();
    g.add(decorMesh(lathe([[0, 0], [0.058, 0], [0.062, 0.14], [0.058, 0.14], [0.054, 0.012], [0, 0.012]]), 'ceramic', 0, 0, 0));
    const sticks = [['wood', 0.3, -0.02, 0.01, 0.1], ['steel', 0.27, 0.025, -0.01, -0.12], ['woodDark', 0.31, 0, 0.02, 0.0], ['wood', 0.25, 0.015, 0.025, -0.28], ['black', 0.28, -0.03, -0.015, 0.2]];
    for (const [mat, len, x, z, lean] of sticks) {
      g.add(decorMesh(new THREE.CylinderGeometry(0.006, 0.006, len, 8), mat, x + lean * 0.05, 0.1 + len / 2 - 0.04, z, [0, 0, -lean]));
      g.add(decorMesh(new THREE.SphereGeometry(0.026, 12, 8), mat, x + lean * 0.05 + lean * 0.14, 0.1 + len - 0.03, z, [0, 0, -lean]));
      g.children[g.children.length - 1].scale.set(1, 1.5, 0.3);
    }
    return g;
  },
  kettle() {
    const g = new THREE.Group();
    g.add(decorMesh(lathe([[0, 0], [0.095, 0], [0.105, 0.04], [0.092, 0.15], [0.05, 0.19], [0, 0.195]]), 'steel', 0, 0, 0));
    g.add(decorMesh(new THREE.CylinderGeometry(0.012, 0.02, 0.1, 10), 'steel', 0.11, 0.12, 0, [0, 0, -0.9]));
    g.add(decorMesh(new THREE.TorusGeometry(0.075, 0.009, 8, 20, Math.PI), 'black', 0, 0.19, 0, [0, 0, 0]));
    return g;
  },
  knives() {
    const g = new THREE.Group();
    g.add(decorMesh(new THREE.BoxGeometry(0.1, 0.17, 0.14), 'woodDark', 0, 0.085, 0, [0, 0, 0]));
    g.children[0].rotation.x = 0;
    for (let i = 0; i < 4; i++) g.add(decorMesh(new THREE.BoxGeometry(0.014, 0.075, 0.026), 'black', -0.033 + i * 0.022, 0.2, 0.02 + 0.0, [-0.22, 0, 0]));
    return g;
  },
};
const DECOR_ORDER = ['crock', 'board', 'plant', 'jars', 'bowl', 'plates', 'kettle', 'knives'];

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}

function updateDecor(force) {
  const sig = (decorOn ? 'on' : 'off') + '|' + currentWallW + '|' + placedCabinets.map(c => `${c.userData.id}:${c.position.x.toFixed(2)}:${c.position.z.toFixed(2)}:${c.userData.run}:${c.userData.spec && c.userData.spec.kind}`).join(',');
  if (!force && sig === decorSignature) return;
  decorSignature = sig;
  if (decorGroup) {
    scene.remove(decorGroup);
    decorGroup.traverse(o => o.geometry && o.geometry.dispose());
    decorGroup = null;
  }
  if (!decorOn || placedCabinets.length === 0) return;
  const group = new THREE.Group();
  const spots = placedCabinets
    .filter(c => c.userData.spec && !c.userData.spec.isWall && ['base', 'drawer', 'dishwasher'].includes(c.userData.spec.kind) && c.userData.spec.w >= 0.4)
    .sort((a, b) => a.position.x - b.position.x || a.position.z - b.position.z);
  const top = 0.89 + 0.001;
  const place = (c, name, h, along, back) => {
    const prop = PROPS[name]();
    if (c.userData.run === 'return') {
      prop.position.set(-currentWallW / 2 + back, top, c.position.z + along);
      prop.rotation.y = Math.PI / 2 + 0.3 * (((h >>> 5) % 7) / 7 - 0.5);
    } else {
      prop.position.set(c.position.x + along, top, currentWallDepth + back);
      prop.rotation.y = 0.5 * (((h >>> 5) % 7) / 7 - 0.5);
    }
    group.add(prop);
  };
  spots.forEach((c, i) => {
    const h = hashString(c.userData.id);
    if (i % 4 === 3) return; // leave some worktop bare
    const spec = c.userData.spec;
    const name = DECOR_ORDER[((h >>> 3) + i) % DECOR_ORDER.length];
    const front = name === 'plates' || name === 'bowl';
    const room = Math.max(0, spec.w - 0.4);
    if (spec.w >= 0.75 && !front) {
      // A wide unit holds two: one at the back, a low one in front or beside.
      place(c, name, h, -room * 0.35, 0.14);
      place(c, front ? 'jars' : 'bowl', h >>> 2, room * 0.3, 0.3);
    } else {
      place(c, name, h, (((h >>> 8) % 100) / 100 - 0.5) * room * 0.6, front ? 0.3 : 0.14);
    }
  });
  decorGroup = group;
  scene.add(group);
}

window.setDecor = function(on) {
  decorOn = !!on;
  updateDecor(true);
  invalidate();
};

// ── Light mood ───────────────────────────────────────────────────────────────
// 'day' is the bright, even light the page has always had. 'evening' is warm:
// the sky dims and turns amber, and the LED strips under the wall units
// light the worktop and the backsplash.
let mood = 'day';
let moodLights = [], moodSignature = '';
const MOODS = {
  day: { background: 0xfaf7f2, key: 1, fill: 1, exposure: 1.12, led: 0xfff4e0, ledPower: 0.4 },
  evening: { background: 0xf0e4d2, key: 0.3, fill: 0.55, exposure: 1.05, led: 0xffcf8a, ledPower: 1.0 },
};
let baseKey = null, baseFill = null;

function applyMood() {
  const m = MOODS[mood];
  scene.background = new THREE.Color(m.background);
  if (scene.fog) scene.fog.color.setHex(m.background);
  if (baseKey === null && keyLight) { baseKey = keyLight.intensity; baseFill = fillLight.intensity; }
  if (keyLight) { keyLight.intensity = baseKey * m.key; keyLight.color.setHex(mood === 'evening' ? 0xffd9b0 : 0xfff0dc); }
  if (fillLight) fillLight.intensity = baseFill * m.fill;
  renderer.toneMappingExposure = m.exposure;
  if (MAT.led) MAT.led.color.setHex(m.led);
  moodSignature = '';
  updateMoodLights(true);
  updateRoom(true);
  invalidate();
}

// One warm point light under each wall unit (at most six, spread along the run).
function updateMoodLights(force) {
  const m = MOODS[mood];
  const walls = placedCabinets.filter(c => c.userData.spec && c.userData.spec.isWall && c.userData.spec.kind !== 'hood');
  const sig = mood + '|' + walls.map(c => `${c.position.x.toFixed(2)}:${c.position.z.toFixed(2)}:${c.userData.run}`).join(',');
  if (!force && sig === moodSignature) return;
  moodSignature = sig;
  for (const l of moodLights) { scene.remove(l); l.dispose && l.dispose(); }
  moodLights = [];
  if (!m.ledPower || walls.length === 0) return;
  const step = Math.max(1, Math.ceil(walls.length / 6));
  walls.forEach((c, i) => {
    if (i % step !== 0) return;
    const spec = c.userData.spec;
    const light = new THREE.PointLight(m.led, m.ledPower * 1.6, 1.6, 2);
    const y = c.position.y - spec.h / 2 - 0.03;
    if (c.userData.run === 'return') light.position.set(c.position.x + spec.d / 2 - 0.12, y, c.position.z);
    else light.position.set(c.position.x, y, c.position.z + spec.d / 2 - 0.12);
    scene.add(light);
    moodLights.push(light);
  });
}

window.setMood = function(next) {
  mood = MOODS[next] ? next : 'day';
  applyMood();
};

// ── The room ─────────────────────────────────────────────────────────────────
// A room round the kitchen wall: a bounded floor, side walls, a ceiling with
// downlights, skirting. The walls and the ceiling are single-sided planes that
// face into the room, so from outside they vanish (a cutaway, like a dolls'
// house) and from inside they are there: the camera in a picture can sit in
// the room or look in from the side. They cast no shadow, so the room is lit
// as if it had large windows; the ceiling is self-lit white.
let roomOn = true;
// A picture is always of the kitchen in its room, even while the screen shows
// the floor plan's own walls (the Room / House views).
let roomCapture = false;
const roomShown = () => roomOn && (roomView === 'kitchen' || roomCapture);
let roomGroup = null, roomSignature = '', roomLights = [];
// How far the room runs out from the wall: far enough to hold an L's side wall with
// room to spare, short enough that a picture isn't mostly wall.
const roomDepth = (D, returnLen) => Math.max(3.6, D + returnLen + 1.3);
let roomWallMaterial = null, roomCeilingMaterial = null;

function roomMaterials() {
  if (!roomWallMaterial) {
    roomWallMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f3ed, roughness: 0.85 });
    roomCeilingMaterial = new THREE.MeshBasicMaterial({ color: 0xece8e0 });
  }
  const style = STYLE_ARCHETYPES[currentArchetypeId];
  if (style) roomWallMaterial.color.setHex(style.wallColor);
  roomCeilingMaterial.color.setHex(mood === 'evening' ? 0xd9cdbb : 0xece8e0);
  return [roomWallMaterial, roomCeilingMaterial];
}

function updateRoom(force) {
  const wall = scenePayload.wall || {};
  const returnLen = wall.shape === 'lShape' ? (wall.return_mm || 0) * MM : 0;
  const shown = roomShown();
  const sig = [shown, currentWallW, currentWallH, currentWallDepth, returnLen, mood, currentArchetypeId].join('|');
  if (!force && sig === roomSignature) return;
  roomSignature = sig;
  if (roomGroup) {
    scene.remove(roomGroup);
    roomGroup.traverse(o => o.geometry && o.geometry.dispose());
    roomGroup = null;
  }
  for (const l of roomLights) scene.remove(l);
  roomLights = [];
  if (floorMesh) floorMesh.visible = !shown;
  if (!shown || !scene) return;

  const [wallMat, ceilingMat] = roomMaterials();
  const W = currentWallW, H = currentWallH, D = currentWallDepth, depth = roomDepth(D, returnLen);
  const group = new THREE.Group();
  group.userData.isRoom = true;
  const plane = (w, h, mat, place) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
    m.receiveShadow = mat !== ceilingMat;
    m.castShadow = false;
    place(m);
    group.add(m);
    return m;
  };

  // The floor: wide enough to run under an L's side wall; the planks keep the
  // same scale as the 30 m floor they replace.
  const x0 = -W / 2 - (returnLen > 0 ? D : 0), x1 = W / 2, fw = x1 - x0, fd = depth;
  const floor = plane(fw, fd, floorMaterial, m => {
    m.rotation.x = -Math.PI / 2;
    m.position.set((x0 + x1) / 2, 0, fd / 2);
  });
  const uv = floor.geometry.attributes.uv;
  for (let i = 0; i < uv.count; i++) uv.setXY(i, uv.getX(i) * fw / 30, uv.getY(i) * fd / 30);
  floor.receiveShadow = true;

  // Side walls, facing into the room. A side wall starts where the kitchen's
  // own wall (or an L's side wall) ends.
  const zLeft = D + returnLen, zRight = D;
  plane(depth - zLeft, H, wallMat, m => { m.rotation.y = Math.PI / 2; m.position.set(-W / 2, H / 2, (zLeft + depth) / 2); });
  plane(depth - zRight, H, wallMat, m => { m.rotation.y = -Math.PI / 2; m.position.set(W / 2, H / 2, (zRight + depth) / 2); });

  // The ceiling, facing down.
  plane(W, depth - D, ceilingMat, m => { m.rotation.x = Math.PI / 2; m.position.set(0, H, (D + depth) / 2); });

  // Skirting along the back wall and the side walls (the cabinets hide most of it).
  const skirt = (len, place) => {
    const m = new THREE.Mesh(new THREE.BoxGeometry(len, 0.09, 0.014), wallMat);
    m.receiveShadow = true;
    place(m);
    group.add(m);
  };
  skirt(W, m => m.position.set(0, 0.045, D + 0.007));
  skirt(depth - zRight, m => { m.rotation.y = -Math.PI / 2; m.position.set(W / 2 - 0.007, 0.045, (zRight + depth) / 2); });
  skirt(depth - zLeft, m => { m.rotation.y = Math.PI / 2; m.position.set(-W / 2 + 0.007, 0.045, (zLeft + depth) / 2); });

  // Recessed downlights in two rows.
  const across = Math.max(2, Math.round(W / 1.3));
  const lamp = new THREE.MeshBasicMaterial({ color: new THREE.Color(3.2, 3.0, 2.6) });
  lamp.userData.lamp = true;
  const trim = new THREE.MeshStandardMaterial({ color: 0xd9d6d0, roughness: 0.5 });
  const spots = [];
  for (let r = 0; r < 2; r++) {
    for (let i = 0; i < across; i++) {
      const x = -W / 2 + (i + 0.5) * W / across, z = D + 0.9 + r * 1.7;
      spots.push([x, z]);
      const disc = new THREE.Mesh(new THREE.CircleGeometry(0.055, 24), lamp);
      disc.rotation.x = Math.PI / 2; disc.position.set(x, H - 0.003, z);
      const ring = new THREE.Mesh(new THREE.RingGeometry(0.055, 0.075, 24), trim);
      ring.rotation.x = Math.PI / 2; ring.position.set(x, H - 0.002, z);
      group.add(disc, ring);
    }
  }
  roomGroup = group;
  scene.add(group);

  // In the evening the downlights are on too: two real lights over the worktop.
  if (mood === 'evening') {
    for (const [x, z] of [spots[0], spots[spots.length - across - 1] || spots[spots.length - 1]]) {
      const light = new THREE.PointLight(0xffd9a8, 1.1, 5, 2);
      light.position.set(x, H - 0.15, z);
      scene.add(light);
      roomLights.push(light);
    }
  }
}

window.setRoom = function(on) {
  roomOn = !!on;
  updateRoom(true);
  invalidate();
};

// ── Door styles ──────────────────────────────────────────────────────────────
// 'slab' is a flat front. 'shaker' is a frame round a recessed panel. 'raised'
// is a frame round a panel that steps up from it. [z] is the middle of the
// front's thickness, as for a slab.
let doorStyle = 'slab';
function addFrontPanel(add, fm, cx, cy, w, h, z) {
  const rail = Math.min(0.072, w * 0.22, h * 0.22);
  if (doorStyle === 'slab' || rail < 0.035) {
    add(boxGeo(w, h, FRONT_T, WOOD_TILE), fm, cx, cy, z);
    return;
  }
  const raised = doorStyle === 'raised';
  const t = FRONT_T;
  const inner = [w - 2 * rail, h - 2 * rail];
  // The panel, set back from the face of the frame.
  add(boxGeo(w, h, t * 0.45, WOOD_TILE), fm, cx, cy, z - t * 0.275);
  // The frame: rails across the top and bottom, stiles between them.
  add(boxGeo(w, rail, t, WOOD_TILE), fm, cx, cy + h / 2 - rail / 2, z);
  add(boxGeo(w, rail, t, WOOD_TILE), fm, cx, cy - h / 2 + rail / 2, z);
  add(boxGeo(rail, inner[1], t, WOOD_TILE), fm, cx - w / 2 + rail / 2, cy, z);
  add(boxGeo(rail, inner[1], t, WOOD_TILE), fm, cx + w / 2 - rail / 2, cy, z);
  if (raised) {
    // Two steps up from the recess: a broad shoulder and a smaller field.
    add(boxGeo(inner[0] - 0.008, inner[1] - 0.008, t * 0.62, WOOD_TILE), fm, cx, cy, z - t * 0.07);
    add(boxGeo(inner[0] - 0.05, inner[1] - 0.05, t * 0.72, WOOD_TILE), fm, cx, cy, z - t * 0.02);
  } else {
    // A fine lip where the frame meets the panel.
    add(boxGeo(inner[0] + 0.006, 0.006, t * 0.62, WOOD_TILE), fm, cx, cy + inner[1] / 2 + 0.003, z - t * 0.07);
    add(boxGeo(inner[0] + 0.006, 0.006, t * 0.62, WOOD_TILE), fm, cx, cy - inner[1] / 2 - 0.003, z - t * 0.07);
  }
}

window.setDoorStyle = function(style) {
  const next = ['slab', 'shaker', 'raised'].includes(style) ? style : 'slab';
  if (next === doorStyle) return;
  doorStyle = next;
  placedCabinets.forEach(rebuildCabinet);
  if (selectedCabinet && selectionBox) selectionBox.setFromObject(selectedCabinet);
  invalidate();
};

// Stainless appliance fronts: ovens get a black glass window under a control
// strip and a bar handle; fridge doors get a vertical bar by the door split.
function buildApplianceFront(add, opts, cx, cy, fw, fh, front) {
  add(boxGeo(fw, fh, FRONT_T), MAT.steel, cx, cy, front - FRONT_T / 2);
  const bar = (bw, bh, x, y) => {
    add(boxGeo(bw, bh, 0.016), MAT.steel, x, y, front + 0.028);
    // Two stand-offs so the bar reads as a handle, not a stripe.
    const along = bw > bh;
    for (const s of [-1, 1]) {
      add(boxGeo(0.012, 0.012, 0.022), MAT.steel,
        along ? x + s * (bw / 2 - 0.02) : x, along ? y : y + s * (bh / 2 - 0.02), front + 0.011);
    }
  };
  if (opts.appliance === 'oven') {
    const strip = Math.min(0.07, fh * 0.18);
    add(boxGeo(fw - 0.06, fh - strip - 0.06, 0.004), MAT.glass, cx, cy - strip / 2 - 0.01, front + 0.002, false);
    bar(fw * 0.72, 0.016, cx, cy + fh / 2 - strip - 0.004);
  } else if (opts.appliance === 'fridge') {
    const len = Math.min(0.5, fh * 0.55);
    const y = opts.at === 'top' ? cy + fh / 2 - len / 2 - 0.05 : cy - fh / 2 + len / 2 + 0.05;
    bar(0.016, len, cx + fw / 2 - 0.06, y);
  }
}

// Wall-mounted canopy hood with a chimney up to the ceiling.
function buildRangehood(spec, add) {
  const { w, h, d, mountH } = spec;
  const bottom = -h / 2;
  add(boxGeo(w, 0.06, d), MAT.steel, 0, bottom + 0.03, 0);
  add(boxGeo(w * 0.86, 0.10, d * 0.8), MAT.steel, 0, bottom + 0.11, -d * 0.1);
  const chimneyBottom = bottom + 0.16;
  const ceiling = currentWallH - mountH - h / 2;
  const chimneyH = Math.max(0.1, ceiling - chimneyBottom);
  add(boxGeo(0.28, chimneyH, 0.26), MAT.steel, 0, chimneyBottom + chimneyH / 2, -d / 2 + 0.13);
  add(boxGeo(w * 0.5, 0.004, 0.06), MAT.led, 0, bottom - 0.002, 0.05, false);
}

function addHandle(add, x0, x1, y0, y1, z, h, isWall) {
  const style = currentFinish().handle.kind;
  const cx = (x0 + x1) / 2;
  if (style === 'groove') {
    // Handleless: a dark finger-pull line along the opening edge.
    const gy = h.drawer || h.at === 'top' ? y1 - 0.006 : y0 + 0.006;
    add(boxGeo(x1 - x0, 0.012, 0.003), MAT.handle, cx, gy, z + 0.0015, false);
    return;
  }
  const knob = () => {
    const g = new THREE.CylinderGeometry(0.014, 0.016, 0.024, 16);
    g.rotateX(Math.PI / 2);
    return g;
  };
  if (h.drawer) {
    const y = y1 - Math.min(0.05, (y1 - y0) / 2);
    if (style === 'bar') add(boxGeo(Math.min(0.32, (x1 - x0) * 0.5), 0.012, 0.014), MAT.handle, cx, y, z + 0.016);
    else add(knob(), MAT.handle, cx, y, z + 0.012);
    return;
  }
  const ex = h.side === 'right' ? x1 - 0.04 : x0 + 0.04;
  if (style === 'bar') {
    const len = h.long ? Math.min(0.5, (y1 - y0) * 0.45) : Math.min(0.16, (y1 - y0) * 0.4);
    const y = h.at === 'top' ? y1 - 0.06 - len / 2 : y0 + 0.06 + len / 2;
    add(boxGeo(0.012, len, 0.014), MAT.handle, ex, y, z + 0.016);
  } else {
    add(knob(), MAT.handle, ex, h.at === 'top' ? y1 - 0.07 : y0 + 0.07, z + 0.012);
  }
}

// L-shaped corner unit: one arm along the main wall, one along the return
// wall (local −x side), with a pair of narrow doors in the inside corner.
function buildCornerParts(group, spec, add) {
  const { w, h, d } = spec;
  const bottom = -h / 2;
  const y0 = bottom + PLINTH_H;
  const bodyH = h / 2 - y0;
  const midY = y0 + bodyH / 2;
  const armD = Math.min(ARM_D, d);
  const notch = w - armD;             // exposed width of each inner face
  const zA = -d / 2 + armD / 2;       // main-wall arm centre (depth)
  const xB = -w / 2 + armD / 2;       // return-wall arm centre (width)
  const fm = MAT.base;

  add(boxGeo(w, PLINTH_H, armD - PLINTH_SET), MAT.plinth, 0, bottom + PLINTH_H / 2, zA - PLINTH_SET / 2);
  add(boxGeo(armD - PLINTH_SET, PLINTH_H, notch), MAT.plinth, xB - PLINTH_SET / 2, bottom + PLINTH_H / 2, d / 2 - notch / 2);
  add(boxGeo(w, bodyH, armD - FRONT_T, WOOD_TILE), fm, 0, midY, zA - FRONT_T / 2);
  add(boxGeo(armD - FRONT_T, bodyH, notch, WOOD_TILE), fm, xB - FRONT_T / 2, midY, d / 2 - notch / 2);

  // Doors on the two inside faces
  const faceZ = -d / 2 + armD;        // front of the main-wall arm
  const faceX = -w / 2 + armD;        // front of the return-wall arm
  add(boxGeo(notch - GAP, bodyH - GAP, FRONT_T, WOOD_TILE), fm, faceX + notch / 2, midY, faceZ - FRONT_T / 2);
  add(boxGeo(FRONT_T, bodyH - GAP, notch - GAP, WOOD_TILE), fm, faceX - FRONT_T / 2, midY, faceZ + notch / 2);
  addHandle(add, faceX, faceX + notch, y0, h / 2, faceZ, { side: 'right', at: 'top' }, false);

  // L-shaped worktop
  const topY = h / 2 + TOP_T / 2;
  add(boxGeo(w, TOP_T, armD + TOP_OVER, STONE_TILE), MAT.top, 0, topY, -d / 2 + (armD + TOP_OVER) / 2);
  add(boxGeo(armD + TOP_OVER, TOP_T, d - armD - TOP_OVER, STONE_TILE), MAT.top,
    -w / 2 + (armD + TOP_OVER) / 2, topY, (d / 2 + (-d / 2 + armD + TOP_OVER)) / 2);
}

// Worktop with a cut-out, a steel basin and a tap.
function buildSinkTop(spec, add) {
  const { w, h, d } = spec;
  const topY = h / 2 + TOP_T / 2;
  const topD = d + TOP_OVER;
  const topZ0 = -d / 2;                 // back edge
  const bw = Math.min(w - 0.16, 0.72);
  const bd = 0.4;
  const bh = 0.18;
  const bz = 0.03;                      // basin centre (depth)
  const side = (w - bw) / 2;
  add(boxGeo(side, TOP_T, topD, STONE_TILE), MAT.top, -w / 2 + side / 2, topY, TOP_OVER / 2);
  add(boxGeo(side, TOP_T, topD, STONE_TILE), MAT.top, w / 2 - side / 2, topY, TOP_OVER / 2);
  const backD = (bz - bd / 2) - topZ0;
  add(boxGeo(bw, TOP_T, backD, STONE_TILE), MAT.top, 0, topY, topZ0 + backD / 2);
  const frontD = (d / 2 + TOP_OVER) - (bz + bd / 2);
  add(boxGeo(bw, TOP_T, frontD, STONE_TILE), MAT.top, 0, topY, bz + bd / 2 + frontD / 2);
  add(new THREE.BoxGeometry(bw, bh, bd), MAT.basin, 0, h / 2 + TOP_T - bh / 2, bz, false);

  // Tap behind the basin
  const tz = bz - bd / 2 - 0.05;
  const base = h / 2 + TOP_T;
  add(new THREE.CylinderGeometry(0.022, 0.025, 0.04, 20), MAT.steel, 0, base + 0.02, tz);
  add(new THREE.CylinderGeometry(0.013, 0.013, 0.26, 16), MAT.steel, 0, base + 0.04 + 0.13, tz);
  const spout = new THREE.TorusGeometry(0.075, 0.013, 10, 24, Math.PI);
  spout.rotateY(-Math.PI / 2);
  add(spout, MAT.steel, 0, base + 0.3, tz + 0.075);
  add(new THREE.CylinderGeometry(0.014, 0.014, 0.03, 16), MAT.steel, 0, base + 0.285, tz + 0.15);
}

// Black glass hob with burner rings, and a chimney hood above it.
function buildHob(spec, add) {
  const { w, h, d } = spec;
  const pw = Math.min(w - 0.08, 0.6);
  const top = h / 2 + TOP_T;
  add(boxGeo(pw, 0.006, 0.5), MAT.glass, 0, top + 0.003, 0, false);
  const ring = () => {
    const g = new THREE.RingGeometry(0.045, 0.062, 28);
    g.rotateX(-Math.PI / 2);
    return g;
  };
  const xs = [-pw / 4, pw / 4];
  const zs = pw >= 0.55 ? [-0.11, 0.11] : [0];
  for (const x of xs) for (const z of zs) add(ring(), MAT.burner, x, top + 0.0065, z, false);

  if (spec.hood === false) return; // a separate Rangehood module is used
  const canopyW = Math.min(Math.max(w, 0.6), 0.9);
  const canopyBottom = 1.62;            // metres above the floor
  const chimneyH = Math.max(0.2, currentWallH - canopyBottom - 0.07);
  add(boxGeo(canopyW, 0.07, 0.48), MAT.steel, 0, canopyBottom + 0.035 - h / 2, -d / 2 + 0.24);
  add(boxGeo(0.26, chimneyH, 0.24), MAT.steel, 0, canopyBottom + 0.07 + chimneyH / 2 - h / 2, -d / 2 + 0.12);
}

function rebuildCabinet(group) {
  for (const child of [...group.children]) {
    group.remove(child);
    if (child.geometry) child.geometry.dispose();
  }
  buildCabinetParts(group, group.userData.spec);
}

let cabinetSerial = 0;
function createCabinetGroup(type, spec, id) {
  const group = new THREE.Group();
  buildCabinetParts(group, spec);
  group.userData = {
    cabinetType: type, spec, label: spec.label,
    id: id || `cabinet_${Date.now()}_${++cabinetSerial}`,
  };
  return group;
}

// Main wall: x is the centre along the wall (metres from its centre).
// Return wall (L-shape): offset is the centre's distance from the main wall.
function placeCabinet(group, spec, { x = 0, run = 'main', offset_mm = 0 } = {}) {
  const y = spec.isWall ? spec.mountH + spec.h / 2 : spec.h / 2;
  if (run === 'return') {
    group.rotation.y = Math.PI / 2;
    group.position.set(-currentWallW / 2 + spec.d / 2, y, currentWallDepth + offset_mm * MM);
  } else {
    group.position.set(x, y, currentWallDepth + spec.d / 2);
  }
}

function addCabinetToScene(group) {
  scene.add(group);
  placedCabinets.push(group);
  cabinetCount = placedCabinets.length;
  document.getElementById('cabinet-count').textContent = placedCabinets.length;
  invalidate();
}

// ── Cabinet spawning ───────────────────────────────────────────────────────
// Manual placement from the module tray: next to the last cabinet of the same
// level, and Flutter is told about it.
window.spawnCabinet = function(type) {
  if (!CABINET_SPECS[type]) return;
  const spec = specFromEntry({ cabinet_type: type });
  const group = createCabinetGroup(type, spec);

  let initialX = (placedCabinets.length % 5) * 0.9 - 1.8;
  const sameLevel = placedCabinets.filter(c =>
    Boolean(c.userData.spec?.isWall) === Boolean(spec.isWall) && c.userData.run !== 'return');
  if (sameLevel.length > 0) {
    const last = sameLevel[sameLevel.length - 1];
    const proposedX = last.position.x + (last.userData.spec?.w || 0.6) / 2 + spec.w / 2;
    if (proposedX + spec.w / 2 <= currentWallW / 2) initialX = proposedX;
  }
  placeCabinet(group, spec, { x: initialX });
  addCabinetToScene(group);

  notifyFlutter({
    event: 'cabinet_placed',
    cabinet_type: type,
    label: spec.label,
    width_mm: spec.w * 1000,
    height_mm: spec.h * 1000,
    depth_mm: spec.d * 1000,
    x_mm: Math.round(initialX * 1000),
    id: group.userData.id,
  });
  showToast(`${spec.label} added`);
};

// Restoring a saved manual cabinet (no Flutter notification).
window.spawnCabinetAt = function(type, x_mm, customId) {
  if (!CABINET_SPECS[type]) return;
  const spec = specFromEntry({ cabinet_type: type });
  const group = createCabinetGroup(type, spec, customId);
  placeCabinet(group, spec, { x: (x_mm ?? 0) * MM });
  addCabinetToScene(group);
};

// Generated layouts (lib/features/layout) carry their own dimensions, kind
// (base / drawer / sink / hob / tall / corner / wall / filler) and run.
function spawnGeneratedCabinet(c) {
  const spec = specFromEntry(c);
  const group = createCabinetGroup(c.cabinet_type, spec, c.id);
  group.userData.run = c.run || 'main';
  group.userData.generated = true;
  placeCabinet(group, spec, { x: (c.x_mm || 0) * MM, run: c.run, offset_mm: c.offset_mm || 0 });
  addCabinetToScene(group);
}

function spawnFromEntry(c) {
  if (c && c.generated) spawnGeneratedCabinet(c);
  else if (c) window.spawnCabinetAt(c.cabinet_type, c.x_mm, c.id);
}

// Materials are shared, so only geometry is freed.
function disposeCabinet(cab) {
  scene.remove(cab);
  cab.traverse(child => { if (child.geometry) child.geometry.dispose(); });
}

// Swaps the whole layout (e.g. variant A → B) without notifying Flutter,
// which already holds the new list.
window.replaceCabinets = function(jsonString) {
  try {
    const list = JSON.parse(jsonString);
    deselectCabinet();
    placedCabinets.forEach(disposeCabinet);
    placedCabinets = [];
    list.forEach(c => spawnFromEntry(c));
    cabinetCount = placedCabinets.length;
    document.getElementById('cabinet-count').textContent = placedCabinets.length;
    invalidate();
  } catch (e) { console.error('replaceCabinets error:', e); }
};

// ── Cabinet touch-drag & selection ──────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer   = new THREE.Vector2();
const floorPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const dragPoint  = new THREE.Vector3();
let isDragging = false, dragCabinet = null, dragOffsetY = 0;
// Cabinets can only be selected or dragged while editing. In the app the
// salesperson turns this on with "Edit"; otherwise touches just orbit, so
// looking around with the client can't move anything by accident.
let editMode = true;
let dragStartX = 0;
window.setEditMode = function(on) {
  editMode = !!on;
  if (!editMode) deselectCabinet();
};
let touchStartX = 0, touchStartY = 0;
let selectedCabinet = null;
let selectionBox = null;

function selectCabinet(cab) {
  if (!cab) return;
  selectedCabinet = cab;
  if (!selectionBox) {
    selectionBox = new THREE.BoxHelper(cab, 0xff8c42);
    scene.add(selectionBox);
  } else {
    selectionBox.setFromObject(cab);
    selectionBox.visible = true;
  }

  const bar = document.getElementById('cabinet-action-bar');
  const nameEl = document.getElementById('selected-cab-name');
  if (nameEl) nameEl.textContent = cab.userData.label || 'Cabinet';
  if (bar) bar.classList.add('show');
  invalidate();
  notifyFlutter({
    event: 'cabinet_selected',
    id: cab.userData.id,
    label: cab.userData.label || 'Cabinet',
    // Return-wall (L-shape) units can't slide yet, by drag or by button.
    movable: cab.userData.run !== 'return',
  });
}

window.deselectCabinet = function() {
  const hadSelection = !!selectedCabinet;
  selectedCabinet = null;
  if (selectionBox) selectionBox.visible = false;
  invalidate();
  const bar = document.getElementById('cabinet-action-bar');
  if (bar) bar.classList.remove('show');
  if (hadSelection) notifyFlutter({ event: 'cabinet_deselected' });
};

window.removeSelectedCabinet = function() {
  if (!selectedCabinet) return;
  const cab = selectedCabinet;
  const label = cab.userData.label || 'Cabinet';
  const id = cab.userData.id;

  disposeCabinet(cab);
  invalidate();

  // Remove from placedCabinets array
  placedCabinets = placedCabinets.filter(c => c !== cab);
  cabinetCount = placedCabinets.length;
  document.getElementById('cabinet-count').textContent = placedCabinets.length;

  deselectCabinet();

  notifyFlutter({
    event: 'cabinet_removed',
    id: id,
    label: label,
  });

  showToast(`${label} removed`);
};

// ── Moving and choosing without dragging (WCAG 2.5.7 and 2.1.1) ────────────
// Flutter's Move left / Move right buttons. The same rules as a drag: a
// main-wall cabinet slides along the wall and stays inside it.
window.nudgeSelectedCabinet = function(dxMm, fromCard) {
  const cab = selectedCabinet;
  // The cabinet card moves the cabinet it is open on, in any mode.
  if (!cab || (!editMode && !fromCard) || cab.userData.run === 'return') return;
  const spec = cab.userData.spec;
  const halfCabW = (spec ? spec.w : 0.6) / 2;
  const halfWallW = currentWallW / 2;
