  const x = Math.min(halfWallW - halfCabW,
    Math.max(-halfWallW + halfCabW, cab.position.x + dxMm * MM));
  if (Math.abs(x - cab.position.x) < 0.0005) return; // already at the wall end
  cab.position.x = x;
  if (selectionBox) selectionBox.setFromObject(cab);
  invalidate();
  notifyFlutter({ event: 'cabinet_moved', id: cab.userData.id, x_mm: Math.round(x * 1000) });
};

// Previous / Next cabinet, so every cabinet can be selected without touching
// the 3D view: base units left to right, then wall units, then the return wall.
function cabinetReadingOrder(a, b) {
  const rank = c => (c.userData.run === 'return' ? 2 : 0) + (c.userData.spec?.isWall ? 1 : 0);
  const along = c => (c.userData.run === 'return' ? c.position.z : c.position.x);
  return rank(a) - rank(b) || along(a) - along(b);
}

window.selectAdjacentCabinet = function(dir) {
  if (!editMode || !placedCabinets.length) return;
  const ordered = [...placedCabinets].sort(cabinetReadingOrder);
  const i = ordered.indexOf(selectedCabinet);
  const n = ordered.length;
  const next = i < 0 ? (dir >= 0 ? 0 : n - 1) : (i + (dir >= 0 ? 1 : -1) + n) % n;
  selectCabinet(ordered[next]);
};

// ── Opening a cabinet: double tap, and the camera goes to it ───────────────
// A double tap (or double click) on a cabinet opens it in any mode: it is
// selected, the camera glides round to it, and the app shows its card. One
// tap only looks around, so the client can turn the view without opening
// anything. The camera goes back to where it was when the card closes.
let lastTap = { t: 0, x: 0, y: 0, id: null };
const DOUBLE_TAP_MS = 380, DOUBLE_TAP_PX = 30;

// [at]: when the tap happened (the event's own time), not when the page got
// to it: a busy frame can hold input back, and two quick taps must still
// count as a double tap.
function onTap(clientX, clientY, at) {
  const hit = getHit(clientX, clientY);
  const now = at || performance.now();
  const id = hit ? hit.userData.id : null;
  const again = now - lastTap.t < DOUBLE_TAP_MS &&
    Math.hypot(clientX - lastTap.x, clientY - lastTap.y) < DOUBLE_TAP_PX;
  if (hit && again && id === lastTap.id) {
    lastTap = { t: 0, x: 0, y: 0, id: null };
    openCabinet(hit);
    return true;
  }
  lastTap = { t: now, x: clientX, y: clientY, id };
  return false;
}

function openCabinet(cab) {
  selectCabinet(cab);
  // In the app, the app moves the camera once its card is up (it knows how
  // much of the view the card covers); on its own the page does it here.
  if (!document.body.classList.contains('is-native-app')) focusCameraOn(cab, viewInset);
  notifyFlutter({
    event: 'cabinet_opened',
    id: cab.userData.id,
    label: cab.userData.label || 'Cabinet',
    movable: cab.userData.run !== 'return',
  });
}

function cabinetById(id) {
  return placedCabinets.find(c => c.userData.id === id) || null;
}

// The part of the screen under the app's card (0 to 0.7): the view is
// shifted up so what the camera looks at sits in the part that shows.
let viewInset = 0;
function applyViewInset() {
  if (!camera) return;
  const w = renderer.domElement.clientWidth || window.innerWidth;
  const h = renderer.domElement.clientHeight || window.innerHeight;
  if (viewInset > 0) camera.setViewOffset(w, h, 0, viewInset * h / 2, w, h);
  else camera.clearViewOffset();
  camera.updateProjectionMatrix();
  invalidate();
}
window.setViewInset = function(fraction) {
  viewInset = Math.max(0, Math.min(0.7, Number(fraction) || 0));
  applyViewInset();
};

const reducedMotion = () =>
  !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

// Where the camera was before the first focus, to go back to.
let focusReturn = null;
let cameraTween = null;

function moveCamera(toPos, toTarget, ms = 480) {
  if (cameraTween) cancelAnimationFrame(cameraTween.raf);
  const fromPos = camera.position.clone(), fromTarget = controls.target.clone();
  if (reducedMotion() || ms <= 0) {
    camera.position.copy(toPos); controls.target.copy(toTarget);
    controls.update(); invalidate();
    cameraTween = null;
    return;
  }
  const start = performance.now();
  const ease = t => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
  const step = () => {
    const t = Math.min(1, (performance.now() - start) / ms), k = ease(t);
    camera.position.lerpVectors(fromPos, toPos, k);
    controls.target.lerpVectors(fromTarget, toTarget, k);
    controls.update(); invalidate();
    if (t < 1) cameraTween.raf = requestAnimationFrame(step); else cameraTween = null;
  };
  cameraTween = { raf: requestAnimationFrame(step) };
}

// From in front of the cabinet, a little above it, far enough back that the
// cabinet and a little of its neighbours fill the part of the view that
// shows. Straight on if nothing stands in the way, else turned or raised a
// little (in an L the side-wall units can stand between the camera and a
// main-wall unit): the first view in which nothing hides the cabinet.
function focusPose(cab, inset) {
  const box = new THREE.Box3().setFromObject(cab);
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const facing = new THREE.Vector3(0, 0, 1).applyQuaternion(cab.getWorldQuaternion(new THREE.Quaternion()));
  facing.y = 0; facing.normalize();
  const fromTarget = camera.position.clone().sub(controls.target);
  const side = Math.sign(facing.x * fromTarget.z - facing.z * fromTarget.x) || 1;
  // Width and height fitted separately: a tall unit on an upright phone
  // needs the height, a wide one on a tablet the width.
  const vHalf = camera.fov / 2 * Math.PI / 180;
  const shownHalf = Math.atan(Math.tan(vHalf) * (1 - (inset || 0)));
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const across = Math.max(size.x, size.z) / 2 + 0.3, up = size.y / 2 + 0.18;
  const dist = Math.min(controls.maxDistance * 0.95,
    Math.max(1.1, across / Math.tan(hHalf), up / Math.tan(shownHalf)) + Math.max(size.x, size.z) / 2);
  const others = placedCabinets.filter(c => c !== cab).flatMap(g => g.children.filter(m => m.isMesh));
  const ray = new THREE.Raycaster();
  // Points that, seen, show the cabinet: first its front (the middle, and
  // higher up); failing that its top (a corner unit's front sits behind the
  // side run of the L, its top doesn't).
  const reach = Math.max(size.x, size.z) / 2 * 0.9;
  const front = center.clone().addScaledVector(facing, reach);
  const fronts = [front, front.clone().setY(box.min.y + size.y * 0.75)];
  const tops = [new THREE.Vector3(center.x, box.max.y - 0.01, center.z), front.clone().setY(box.max.y - 0.02)];
  const poseAt = (azDeg, elDeg) => {
    const dir = facing.clone().applyAxisAngle(new THREE.Vector3(0, 1, 0), -side * azDeg * Math.PI / 180);
    dir.multiplyScalar(Math.cos(elDeg * Math.PI / 180));
    dir.y = Math.sin(elDeg * Math.PI / 180);
    return center.clone().addScaledVector(dir.normalize(), dist);
  };
  const visible = (pos, m) => {
    const to = m.clone().sub(pos), len = to.length();
    ray.set(pos, to.normalize()); ray.far = len - 0.02;
    return ray.intersectObjects(others, false).length === 0;
  };
  // The whole front (middle and higher up) must show; for the top, any of it.
  const seen = (pos, marks) => marks === fronts
    ? marks.every(m => visible(pos, m))
    : marks.some(m => visible(pos, m));
  const tries = [[18, 14], [0, 14], [-18, 14], [18, 30], [0, 30], [-18, 30], [-35, 24], [35, 24],
    [0, 45], [-30, 45], [30, 45], [0, 62]];
  for (const marks of [fronts, tops]) {
    for (const [az, el] of tries) {
      const pos = poseAt(az, el);
      if (seen(pos, marks)) return { pos, target: center };
    }
  }
  return { pos: poseAt(0, 45), target: center };
}

// A swipe just before keeps turning the view for a moment (damping); that
// is finished at once, so the glide starts and ends where it should.
function stopInertia() {
  const damping = controls.enableDamping;
  controls.enableDamping = false;
  controls.update();
  controls.enableDamping = damping;
}

function focusCameraOn(cab, inset) {
  stopInertia();
  if (!focusReturn) focusReturn = { pos: camera.position.clone(), target: controls.target.clone() };
  const { pos, target } = focusPose(cab, inset);
  moveCamera(pos, target);
}

// ── A cabinet not placed yet ─────────────────────────────────────────────────
// While the app's "Add" card is open, the unit it would add shows where it
// would go: see-through, with a green outline, not tappable, not counted, not
// in the pictures. The camera goes to it as to a cabinet.
let previewGroup = null, previewOutline = null;

function clearPreviewGroup() {
  if (previewOutline) { scene.remove(previewOutline); previewOutline.geometry.dispose(); previewOutline.material.dispose(); previewOutline = null; }
  if (!previewGroup) return;
  scene.remove(previewGroup);
  previewGroup.traverse(o => {
    if (o.geometry) o.geometry.dispose();
    if (o.userData.previewMaterial) o.material.dispose();
  });
  previewGroup = null;
}

window.previewCabinet = function(json, inset) {
  clearPreviewGroup();
  let c;
  try { c = typeof json === 'string' ? JSON.parse(json) : json; } catch (e) { return false; }
  if (!c || !c.width_mm) return false;
  const spec = specFromEntry({ ...c, generated: true });
  const group = createCabinetGroup(c.cabinet_type, spec, '__preview__');
  group.userData.run = c.run || 'main';
  group.userData.isPreview = true;
  placeCabinet(group, spec, { x: (c.x_mm || 0) * MM, run: c.run, offset_mm: c.offset_mm || 0 });
  group.traverse(o => {
    if (!o.isMesh) return;
    // The materials are shared with the real cabinets: see-through copies.
    const m = o.material.clone();
    m.transparent = true; m.opacity = 0.45; m.depthWrite = false;
    o.material = m;
    o.userData.previewMaterial = true;
    o.castShadow = false;
  });
  scene.add(group);
  previewGroup = group;
  group.updateMatrixWorld(true);
  previewOutline = new THREE.BoxHelper(group, 0x2f8f6f);
  previewOutline.userData.noPicture = true;
  scene.add(previewOutline);
  if (inset !== undefined) window.setViewInset(inset);
  focusCameraOn(group, viewInset);
  invalidate();
  return true;
};

/** The Add card closed (or the unit was placed): the see-through one goes. */
window.clearPreview = function() {
  clearPreviewGroup();
  invalidate();
};

/** Selects the cabinet [id] and takes the camera to it (the app's card is open on it). */
window.focusCabinet = function(id, inset) {
  const cab = cabinetById(id);
  if (!cab) return false;
  if (inset !== undefined) window.setViewInset(inset);
  selectCabinet(cab);
  focusCameraOn(cab, viewInset);
  return true;
};

/** Selects the cabinet [id] without moving the camera. */
window.selectCabinetById = function(id) {
  const cab = cabinetById(id);
  if (cab) selectCabinet(cab);
  return !!cab;
};

/** The card closed: the camera goes back to where it was, and the view to full height. */
window.unfocusCabinet = function() {
  stopInertia();
  window.setViewInset(0);
  if (focusReturn) moveCamera(focusReturn.pos, focusReturn.target);
  focusReturn = null;
};

// ── Touch & Mouse Drag with Magnetic Snapping ──────────────────────────────
function setupCabinetDrag() {
  const canvas = renderer.domElement;

  function onDragStart(clientX, clientY) {
    touchStartX = clientX;
    touchStartY = clientY;
    if (!editMode) return;
    const hit = getHit(clientX, clientY);
    if (hit && hit.userData.run === 'return') {
      // Drag only slides along the main wall; return-wall units are tap-to-select.
      selectCabinet(hit);
      return;
    }
    if (hit) {
      dragCabinet = hit;
      dragStartX = hit.position.x;
      dragOffsetY = hit.position.y;
      isDragging = true;
      controls.enabled = false;
      selectCabinet(hit);
    }
  }

  function onDragMove(clientX, clientY) {
    if (!isDragging || !dragCabinet) return;
    updatePointer(clientX, clientY);
    raycaster.setFromCamera(pointer, camera);

    const spec = dragCabinet.userData.spec;
    const frontWallZ = currentWallDepth + (spec ? spec.d / 2 : 0.3);

    // Intersect with the wall plane for drag position
    const wallPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), -frontWallZ);
    raycaster.ray.intersectPlane(wallPlane, dragPoint);

    let targetX = dragPoint.x;
    const halfCabW = (spec ? spec.w : 0.6) / 2;

    // ── Magnetic Snapping (120mm threshold) ──
    const snapThreshold = 0.12; // 120mm
    let didSnap = false;
    let snapGuideX = null;

    // Check neighbor cabinets of the same mounting type
    for (const other of placedCabinets) {
      if (other === dragCabinet) continue;
      const otherSpec = other.userData.spec;
      if (!otherSpec) continue;
      if (Boolean(otherSpec.isWall) !== Boolean(spec?.isWall)) continue;

      const otherHalfW = otherSpec.w / 2;
      const otherLeft = other.position.x - otherHalfW;
      const otherRight = other.position.x + otherHalfW;

      // Snap to right side of other
      const toRight = otherRight + halfCabW;
      if (Math.abs(targetX - toRight) < snapThreshold) {
        targetX = toRight;
        didSnap = true;
        snapGuideX = otherRight;
        break;
      }

      // Snap to left side of other
      const toLeft = otherLeft - halfCabW;
      if (Math.abs(targetX - toLeft) < snapThreshold) {
        targetX = toLeft;
        didSnap = true;
        snapGuideX = otherLeft;
        break;
      }
    }

    // Wall boundary snap
    const halfWallW = currentWallW / 2;
    if (!didSnap) {
      if (Math.abs((targetX - halfCabW) - (-halfWallW)) < snapThreshold) {
        targetX = -halfWallW + halfCabW;
        didSnap = true;
        snapGuideX = -halfWallW;
      } else if (Math.abs((targetX + halfCabW) - halfWallW) < snapThreshold) {
        targetX = halfWallW - halfCabW;
        didSnap = true;
        snapGuideX = halfWallW;
      }
    }

    // Update snap guide line
    updateSnapGuide(didSnap, snapGuideX, dragCabinet.position.y, spec ? spec.h : 0.85);

    // Notify Flutter on new snap event
    if (didSnap && !dragCabinet.userData.lastSnapped) {
      notifyFlutter({
        event: 'cabinet_snapped',
        id: dragCabinet.userData.id,
        x_mm: Math.round(targetX * 1000),
      });
      dragCabinet.userData.lastSnapped = true;
    } else if (!didSnap) {
      dragCabinet.userData.lastSnapped = false;
    }

    // Strictly lock Z to front wall face to prevent floating/penetration
    dragCabinet.position.set(targetX, dragCabinet.position.y, frontWallZ);

    if (selectionBox && selectionBox.visible) {
      selectionBox.setFromObject(dragCabinet);
    }
  }

  function onDragEnd(clientX, clientY, at) {
    if (clientX !== undefined && clientY !== undefined) {
      const dx = clientX - touchStartX;
      const dy = clientY - touchStartY;
      // A tap (not a drag): a second tap on the same cabinet opens it.
      const tapped = dx * dx + dy * dy < 25;
      const opened = tapped && onTap(clientX, clientY, at);
      if (editMode && tapped && !opened) {
        const hit = getHit(clientX, clientY);
        if (hit) selectCabinet(hit);
        else deselectCabinet();
      }
    }
    updateSnapGuide(false);
    if (dragCabinet && Math.abs(dragCabinet.position.x - dragStartX) > 0.001) {
      dragCabinet.userData.lastSnapped = false;
      notifyFlutter({
        event: 'cabinet_moved',
        id: dragCabinet.userData.id,
        x_mm: Math.round(dragCabinet.position.x * 1000),
      });
    }
    isDragging = false;
    dragCabinet = null;
    controls.enabled = true;
  }

  // Touch handlers. After a touch the browser also sends mouse events for
  // it; those are ignored, or one tap would count twice.
  let lastTouch = -1e9;
  const fromTouch = () => performance.now() - lastTouch < 800;
  canvas.addEventListener('touchstart', e => {
    lastTouch = performance.now();
    if (e.touches.length !== 1) return;
    onDragStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  canvas.addEventListener('touchmove', e => {
    if (e.touches.length !== 1) return;
    onDragMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  canvas.addEventListener('touchend', e => {
    lastTouch = performance.now();
    const t = e.changedTouches[0];
    onDragEnd(t?.clientX, t?.clientY, e.timeStamp);
  }, { passive: true });

  // Mouse handlers (the browser, and testing). A click that started on the
  // view ends here even when nothing was dragged, so it can count as a tap.
  let mouseDownOnView = false;
  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0 || fromTouch()) return;
    mouseDownOnView = true;
    onDragStart(e.clientX, e.clientY);
  });
  window.addEventListener('mousemove', e => {
    if (isDragging) onDragMove(e.clientX, e.clientY);
  });
  window.addEventListener('mouseup', e => {
    if (fromTouch()) { mouseDownOnView = false; return; }
    if (isDragging || mouseDownOnView) onDragEnd(e.clientX, e.clientY, e.timeStamp);
    mouseDownOnView = false;
  });
}

function updatePointer(x, y) {
  const isNative = document.body.classList.contains('is-native-app');
  const w = isNative ? window.innerWidth : (window.innerWidth - 96);
  pointer.x =  (x / w) * 2 - 1;
  pointer.y = -(y / window.innerHeight) * 2 + 1;
}

function getHit(x, y) {
  updatePointer(x, y);
  raycaster.setFromCamera(pointer, camera);
  const meshes = placedCabinets.flatMap(g => g.children.filter(c => c.isMesh));
  const hits = raycaster.intersectObjects(meshes, false);
  return hits.length ? hits[0].object.parent : null;
}

// ── Animation & resize ─────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const cameraMoved = controls.update();
  if (!cameraMoved && framesToRender <= 0 && !isDragging) return;
  framesToRender = Math.max(0, framesToRender - 1);
  if (selectionBox && selectionBox.visible && selectedCabinet) {
    selectionBox.setFromObject(selectedCabinet);
  }
  updateBacksplash();
  updateDecor();
  updateMoodLights();
  updateRoom();
  renderer.render(scene, camera);
}

function onResize() {
  const isNative = document.body.classList.contains('is-native-app');
  const w = isNative ? window.innerWidth : (window.innerWidth - 96);
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  applyViewInset();
  invalidate();
}

// ── Flutter bridge ─────────────────────────────────────────────────────────
function notifyFlutter(data) {
  try { StaticTraceChannel.postMessage(JSON.stringify(data)); }
  catch (_) { console.log('[StaticTrace]', data); }
}

// ── Public API called from Flutter via runJavaScript() ─────────────────────
window.setNativeMode = function(isNative) {
  document.body.classList.toggle('is-native-app', !!isNative);
  editMode = !isNative; // the app enables editing explicitly
  onResize();
};

window.loadScene = function(jsonString) {
  try {
    scenePayload = JSON.parse(jsonString);
    const { wall, obstacles = [] } = scenePayload;
    buildWall(wall, obstacles);
    buildHouse(scenePayload.floor_plan);
    if (roomView !== 'kitchen') window.setRoomView(roomView);
  } catch (e) { console.error('loadScene error:', e); }
  invalidate();
};

// ── Room and House views: the floor plan around the kitchen ──────────────
// A room read off a floor plan comes with the plan's walls (in mm from the
// kitchen's corner: x along the main wall, z into the room) and the plan's
// picture. Kitchen shows the kitchen alone, as before; Room adds the walls
// around it; House lays the plan on the floor at true size and raises every
// wall the sales app found on it.
let houseGroup = null;
let roomView = 'kitchen';

function kitchenToScene(xMm, zMm) {
  return [xMm * MM - currentWallW / 2, currentWallDepth + zMm * MM];
}

// Rectangles as [x, z, width, depth]. What two share, or null.
function overlap([x, z, w, d], [bx, bz, bw, bd]) {
  const x0 = Math.max(x, bx), z0 = Math.max(z, bz);
  const x1 = Math.min(x + w, bx + bw), z1 = Math.min(z + d, bz + bd);
  return x1 > x0 && z1 > z0 ? [x0, z0, x1 - x0, z1 - z0] : null;
}

// What's left of a once b is cut out of it: up to four rectangles.
function cutOut(a, b) {
  const o = overlap(a, b);
  if (!o) return [a];
  const [x, z, w, d] = a;
  const [ox, oz, ow, od] = o;
  const left = [];
  if (ox > x) left.push([x, z, ox - x, d]);
  if (ox + ow < x + w) left.push([ox + ow, z, x + w - ox - ow, d]);
  if (oz > z) left.push([ox, z, ow, oz - z]);
  if (oz + od < z + d) left.push([ox, oz + od, ow, z + d - oz - od]);
  return left;
}

function buildHouse(plan) {
  if (houseGroup) {
    scene.remove(houseGroup);
    houseGroup.traverse(o => {
      o.geometry?.dispose();
      o.material?.map?.dispose();
      o.material?.dispose();
    });
    houseGroup = null;
  }
  if (!plan) return;

  const group = new THREE.Group();
  group.visible = false;
  const H = currentWallH;
  const t = plan.wall_thickness_mm || 150;
  const k = plan.kitchen_mm || [0, 0, 0, 0];
  const wall = scenePayload.wall || {};
  const mainMm = currentWallW / MM;
  const returnMm = wall.shape === 'lShape' ? (wall.return_mm || 0) : 0;

  // The plan's picture on the floor, turned to line up with the kitchen.
  if (plan.image && plan.image_size_mm) {
    const [cx, cz] = kitchenToScene(...plan.image_center_mm);
    const holder = new THREE.Group();
    holder.position.set(cx, 0.003, cz);
    holder.rotation.y = (plan.image_rotation_deg || 0) * Math.PI / 180;
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.95 });
    new THREE.TextureLoader().load(plan.image, tex => {
      if (THREE.SRGBColorSpace) tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
      mat.map = tex;
      mat.needsUpdate = true;
      invalidate();
    }, undefined, () => console.warn('Floor plan picture unavailable'));
    const sheet = new THREE.Mesh(
      new THREE.PlaneGeometry(plan.image_size_mm[0] * MM, plan.image_size_mm[1] * MM), mat);
    sheet.rotation.x = -Math.PI / 2;
    sheet.receiveShadow = true;
    holder.add(sheet);
    holder.userData.houseOnly = true;
    group.add(holder);
  }

  // The plan's walls. The kitchen's own main wall, and for an L its side
  // wall with the corner, are already drawn (with their doors and windows),
  // so those stretches are cut out of the plan's walls; the rest of a long
  // wall, like the house's outside wall running on past the kitchen, stays.
  // Generous across the thickness: the plan's walls are measured to the
  // pixel.
  const own = [[0, -t * 1.6, mainMm, t * 2.2]];
  if (returnMm > 0) own.push([-t * 1.6, -t * 1.6, t * 2.2, returnMm + t * 1.6]);
  // Room shows the kitchen's own room: its walls, a wall's thickness round.
  const room = [k[0] - t * 2, k[1] - t * 2, k[2] + t * 4, k[3] + t * 4];
  const wallMat = new THREE.MeshStandardMaterial({ color: 0xebe5dc, roughness: 0.9 });
  const raise = ([x, z, w, d], houseOnly) => {
    if (w < 30 || d < 30) return; // a sliver left by the cutting
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(w * MM, H, d * MM), wallMat);
    const [sx, sz] = kitchenToScene(x + w / 2, z + d / 2);
    mesh.position.set(sx, H / 2, sz);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    mesh.userData.houseOnly = houseOnly;
    group.add(mesh);
  };
  for (const r of plan.walls || []) {
    if (!(r[2] > 0 && r[3] > 0)) continue;
    let pieces = [r];
    for (const o of own) pieces = pieces.flatMap(p => cutOut(p, o));
    for (const p of pieces) {
      const inRoom = overlap(p, room);
      if (inRoom) raise(inRoom, false);
      for (const outside of cutOut(p, room)) raise(outside, true);
    }
  }

  houseGroup = group;
  scene.add(group);
}

/** 'kitchen', 'room' or 'house'. */
window.setRoomView = function(view) {
  roomView = view;
  updateRoom();
  if (houseGroup) {
    houseGroup.visible = view !== 'kitchen';
    for (const o of houseGroup.children) o.visible = view === 'house' || !o.userData.houseOnly;
  }
  const plan = scenePayload.floor_plan;
  if (view === 'kitchen' || !plan) {
    window.resetFrontView();
    return;
  }
  // Frame the kitchen with the walls around it, or the whole plan, from
  // above at an angle.
  let [x, z, w, d] = plan.kitchen_mm;
  if (view === 'room') {
    const m = 1500;
    x -= m; z -= m; w += 2 * m; d += 2 * m;
  } else if (plan.image_size_mm) {
    const turned = Math.abs((plan.image_rotation_deg || 0) % 180) === 90;
    const [iw, ih] = plan.image_size_mm;
    w = turned ? ih : iw;
    d = turned ? iw : ih;
    x = plan.image_center_mm[0] - w / 2;
    z = plan.image_center_mm[1] - d / 2;
  }
  const [sx, sz] = kitchenToScene(x + w / 2, z + d / 2);
  // Far enough back for the whole area to fit the screen, whatever its
  // shape: a phone held upright is narrow, so the width usually decides.
  // Steep, so the near walls don't hide the rooms behind them. The
  // controls above and the layouts panel below cover about half the
  // screen's height, so the depth is fitted into what's left.
  const elevation = (view === 'house' ? 62 : 55) * Math.PI / 180;
  const vHalf = camera.fov / 2 * Math.PI / 180;
  const hHalf = Math.atan(Math.tan(vHalf) * camera.aspect);
  const shownHalf = Math.atan(Math.tan(vHalf) * 0.5);
  const across = w * MM;
  const deep = d * MM * Math.sin(elevation) + currentWallH * Math.cos(elevation);
  const dist = Math.min(controls.maxDistance * 0.95, 1.1 * Math.max(
    across / 2 / Math.tan(hHalf),
    deep / 2 / Math.tan(shownHalf),
  ));
  controls.target.set(sx, 0, sz);
  camera.position.set(sx, dist * Math.sin(elevation), sz + dist * Math.cos(elevation));
  controls.update();
  invalidate();
};

// ── Pictures of the design ──────────────────────────────────────────────────
// What goes in the quote PDF and the client's message: the kitchen as a
// picture, from the front and from an angle, at one size whatever the screen
// is. They use their own cameras (the viewer's view isn't touched) and leave
// out the editing aids (selection box, snap guide, the plan around the room).
let PICTURE_W = 1600, PICTURE_H = 1000; // `let`: tests render smaller pictures

// Where the pictures are taken from: a direction from the kitchen's centre
// (x to the right, y up, z toward the viewer). The L-shape's return wall is
// on the left, so the angled view looks in from the right.
function pictureViews() {
  const dirOf = (azimuthDeg, elevationDeg) => {
    const az = azimuthDeg * Math.PI / 180, el = elevationDeg * Math.PI / 180;
    return new THREE.Vector3(Math.sin(az) * Math.cos(el), Math.sin(el), Math.cos(az) * Math.cos(el));
  };
  return [
    { name: 'front', dir: dirOf(0, 4) },
    { name: 'angle', dir: dirOf(34, 14) },
  ];
}

// What the pictures must hold: the walls, every cabinet, doors and windows.
function designBox() {
  const box = new THREE.Box3();
  for (const o of scene.children) {
    if (o.userData.isWall || o.userData.isObstacleMarker) box.expandByObject(o);
  }
  for (const c of placedCabinets) box.expandByObject(c);
  return box;
}

// How far back a camera must be, looking along -dir at target, for every
// corner of the box to be in frame with a margin.
function pictureDistance(cam, target, dir, corners) {
  const p = new THREE.Vector3();
  const fits = d => {
    cam.position.copy(target).addScaledVector(dir, d);
    cam.lookAt(target);
    cam.updateMatrixWorld(true);
    return corners.every(c => {
      p.copy(c).project(cam);
      return Math.abs(p.x) <= 0.95 && Math.abs(p.y) <= 0.95 && p.z < 1;
    });
  };
  let lo = 0.3, hi = 1;
  while (!fits(hi) && hi < 80) hi *= 1.5;
  for (let i = 0; i < 16; i++) {
    const mid = (lo + hi) / 2;
    if (fits(mid)) hi = mid; else lo = mid;
  }
  return hi;
}

// A rendered picture takes the canvas for a while; nothing else may use it then.
let renderBusy = false, renderCancelled = false;
window.cancelRender = function() { renderCancelled = true; };

// Takes the pictures. Returns [{ name, data }] (data: a JPEG data URL) and
// tells the app, which waits for the pictures when a quote is sent.
window.capturePictures = function(requestId) {
  const images = [];
  const box = designBox();
  if (renderBusy) {
    notifyFlutter({ event: 'pictures', request_id: requestId || null, busy: true, images: [], names: [] });
    return images;
  }
  // Textures still decoding: take the pictures when they are on the materials.
  if (FINISH.loading > 0) {
    whenTexturesSettled(() => window.capturePictures(requestId));
    return images;
  }
  if (!box.isEmpty() && renderer && scene) {
    updateBacksplash();
    updateDecor();
    updateMoodLights();
    roomCapture = true;
    updateRoom();
    const prevRatio = renderer.getPixelRatio();
    const prevSize = renderer.getSize(new THREE.Vector2());
    const hidden = [selectionBox, snapGuideLine, houseGroup, previewGroup, previewOutline].filter(o => o && o.visible);
    try {
      hidden.forEach(o => { o.visible = false; });
      renderer.setPixelRatio(1);
      renderer.setSize(PICTURE_W, PICTURE_H, false);
      const cam = new THREE.PerspectiveCamera(38, PICTURE_W / PICTURE_H, 0.05, 200);
      const target = box.getCenter(new THREE.Vector3());
      const corners = [];
      for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
        corners.push(new THREE.Vector3(x, y, z));
      }
      for (const view of pictureViews()) {
        // The distance first: finding it moves the camera.
        const distance = pictureDistance(cam, target, view.dir, corners);
        cam.position.copy(target).addScaledVector(view.dir, distance);
        cam.lookAt(target);
        cam.updateMatrixWorld(true);
        renderer.render(scene, cam);
        images.push({ name: view.name, data: renderer.domElement.toDataURL('image/jpeg', 0.9) });
      }
    } catch (e) {
      console.error('capturePictures error:', e);
    } finally {
      hidden.forEach(o => { o.visible = true; });
      roomCapture = false;
      updateRoom();
      renderer.setPixelRatio(prevRatio);
      renderer.setSize(prevSize.x, prevSize.y, false);
      onResize();
      invalidate();
    }
  }
  notifyFlutter({ event: 'pictures', request_id: requestId || null, images: images.map(i => i.data), names: images.map(i => i.name) });
  return images;
};

// ── Rendered pictures ───────────────────────────────────────────────────────
// The live view is lit by one shadow-casting light and a flat fill, so it
// looks like a model. A rendered picture is built from many frames of the
// same view, each lit from a different part of the sky and with the sun
// nudged a little, then averaged: shadows go soft, corners and the underside
// of wall cabinets darken the way they do in a real room, and edges are
// smoothed. Slower (a few seconds), so it is asked for, not automatic.
const halton = (i, base) => {
  let f = 1, r = 0;
  while (i > 0) { f /= base; r += f * (i % base); i = Math.floor(i / base); }
  return r;
};
const nextFrame = () => new Promise(resolve => requestAnimationFrame(() => resolve()));

// How the rendered look is balanced; tuned by eye against the live view.
const RENDER_LOOK = {
  sky: 2.4,            // each frame's sky light (the average is what's seen)
  skyColor: 0xe8f0ff,
  sun: 0.9,            // the key light, as a share of its live strength
  fill: 0.04,          // the flat hemisphere fill, as a share
  env: 0.2,            // reflections and ambient from the environment map
  sunSpread: 0.7,      // metres the sun moves about its place (softens its shadow)
  skyMinHeight: 0.16,  // lowest sky direction used (0 is the horizon)
  exposure: 1.3,       // brightness, as a multiple of the live view's
};

window.RENDER_LOOK = RENDER_LOOK; // adjustable while tuning

function showRenderProgress(text) {
  let el = document.getElementById('render-overlay');
  if (!text) { if (el) el.remove(); return; }
  if (!el) {
    el = document.createElement('div');
    el.id = 'render-overlay';
    el.setAttribute('role', 'status');
    Object.assign(el.style, {
      position: 'fixed', left: '50%', top: '50%', transform: 'translate(-50%,-50%)',
      padding: '10px 18px', borderRadius: '12px', background: 'rgba(36,31,27,.86)', color: '#fff',
      font: '600 14px system-ui, sans-serif', zIndex: 50, pointerEvents: 'none',
    });
    document.body.appendChild(el);
  }
  el.textContent = text;
}

// One rendered picture from [cam]: [samples] frames averaged.
async function renderStill(cam, W, H, samples, label, onProgress) {
  const gl = renderer.getContext();
  const acc = new Float32Array(W * H * 4);
  const px = new Uint8Array(W * H * 4);
  const box = designBox();
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const center = sphere.center, radius = sphere.radius * 1.15;

  // A sky light that moves to a new place in the sky every frame.
  const look = mood === 'evening' ? { ...RENDER_LOOK, sky: 1.5, skyColor: 0xffe3c4, sun: 0.4, env: 0.16, exposure: 1.5 } : RENDER_LOOK;
  const sky = new THREE.DirectionalLight(look.skyColor, look.sky);
  sky.castShadow = true;
  sky.shadow.mapSize.set(2048, 2048);
  sky.shadow.bias = -0.0005;
  sky.shadow.normalBias = 0.02;
  Object.assign(sky.shadow.camera, { left: -radius, right: radius, top: radius, bottom: -radius, near: 0.1, far: radius * 5 });
  sky.target.position.copy(center);
  scene.add(sky, sky.target);

  // The live lighting, turned down so the sky shapes the picture.
  const keyBase = keyLight.position.clone(), keyStrength = keyLight.intensity, fillStrength = fillLight.intensity;
  keyLight.intensity = keyStrength * look.sun;
  fillLight.intensity = fillStrength * look.fill;
  const envScaled = [];
  const seen = new Set();
  scene.traverse(o => {
    for (const m of [].concat(o.material || [])) {
      if (m && !seen.has(m) && 'envMapIntensity' in m) { seen.add(m); envScaled.push([m, m.envMapIntensity]); m.envMapIntensity *= look.env; }
    }
  });
  const fog = scene.fog; scene.fog = null;
  const exposureBefore = renderer.toneMappingExposure;
  renderer.toneMappingExposure = exposureBefore * look.exposure;

  try {
    for (let i = 0; i < samples; i++) {
      // Sky: a cosine-weighted direction over the hemisphere.
      const u = halton(i + 1, 2), v = halton(i + 1, 3);
      const r = Math.sqrt(u), phi = 2 * Math.PI * v;
      const dir = new THREE.Vector3(r * Math.cos(phi), Math.max(Math.sqrt(1 - u), RENDER_LOOK.skyMinHeight), r * Math.sin(phi)).normalize();
      sky.position.copy(center).addScaledVector(dir, radius * 2.5);
      // The sun moves a little about its place.
      keyLight.position.copy(keyBase).add(new THREE.Vector3(
        (halton(i + 1, 5) - 0.5) * 2 * RENDER_LOOK.sunSpread,
        (halton(i + 1, 7) - 0.5) * RENDER_LOOK.sunSpread,
        (halton(i + 1, 11) - 0.5) * 2 * RENDER_LOOK.sunSpread));
      // The view moves less than a pixel, so edges average out.
      cam.setViewOffset(W, H, halton(i + 1, 13) - 0.5, halton(i + 1, 17) - 0.5, W, H);
      renderer.render(scene, cam);
      gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, px);
      for (let k = 0; k < px.length; k++) acc[k] += px[k];
      if (i % 3 === 2) {
        showRenderProgress(`${label} ${Math.round(100 * (i + 1) / samples)}%`);
        if (onProgress) onProgress((i + 1) / samples);
        await nextFrame();
        if (renderCancelled) throw new Error('cancelled');
      }
    }
  } finally {
    cam.clearViewOffset();
    scene.remove(sky, sky.target);
    sky.dispose();
    keyLight.position.copy(keyBase);
    keyLight.intensity = keyStrength;
    fillLight.intensity = fillStrength;
    envScaled.forEach(([m, v]) => { m.envMapIntensity = v; });
    scene.fog = fog;
    renderer.toneMappingExposure = exposureBefore;
  }

  // The average, top row first (readPixels is bottom-up).
  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const image = g.createImageData(W, H);
  for (let y = 0; y < H; y++) {
    const from = (H - 1 - y) * W * 4, to = y * W * 4;
    for (let x = 0; x < W * 4; x++) image.data[to + x] = Math.round(acc[from + x] / samples);
  }
  g.putImageData(image, 0, 0);
  return canvas.toDataURL('image/jpeg', 0.92);
}

// ── True lighting: path tracing ─────────────────────────────────────────────
// The render above fakes bounced light by averaging many skies. This one
// follows light paths on the graphics chip (three-gpu-pathtracer, bundled in
// pathtracer.min.js and handed over by the app as window.PathTracerLib), so the
// light really bounces: the oak tints the wall beside it, corners darken, the
// LED strips light the tile. It needs WebGL 2 with float render targets; when
// the device lacks them the app gets the sky-averaged render instead.
const PATH_LOOK = {
  day: {
    skyTop: 0x9fc4f0, skyBottom: 0xfff4e2, sky: 0.7, sun: 4.2, sunColor: 0xfff0dc,
    strip: 12, down: 0, exposure: 0.58, bounces: 5,
  },
  evening: {
    skyTop: 0x59486a, skyBottom: 0xffcf99, sky: 0.32, sun: 0.0, sunColor: 0xffd9b0,
    strip: 38, down: 260, exposure: 0.95, bounces: 5,
  },
};
window.PATH_LOOK = PATH_LOOK; // adjustable while tuning

// The graphics chip's name, where the browser says (it helps to read a test).
function gpuName() {
  try {
    const gl = renderer.getContext();
    const info = gl.getExtension('WEBGL_debug_renderer_info');
    return info ? String(gl.getParameter(info.UNMASKED_RENDERER_WEBGL)) : '';
  } catch (e) { return ''; }
}

function pathTracerAvailable() {
  try {
    if (!window.PathTracerLib || !renderer) return false;
    const gl = renderer.getContext();
    return typeof WebGL2RenderingContext !== 'undefined' && gl instanceof WebGL2RenderingContext &&
      !!renderer.extensions.get('EXT_color_buffer_float');
  } catch (e) { return false; }
}
window.pathTracerAvailable = pathTracerAvailable;

// What the picture's tone curve does to a value (ACES, then gamma), so the
// backdrop can be set to a radiance that comes out as the colour we want.
function pathTone(x, exposure) {
  x *= exposure;
  const v = Math.min(1, Math.max(0, (x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14)));
  return Math.pow(v, 1 / 2.2);
}
function pathBackdrop(hex, exposure) {
  const want = new THREE.Color(hex).convertLinearToSRGB(); // the colour as a picture shows it
  const solve = target => {
    let lo = 0, hi = 400;
    for (let i = 0; i < 40; i++) { const mid = (lo + hi) / 2; if (pathTone(mid, exposure) < target) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  };
  return new THREE.Color(solve(want.r), solve(want.g), solve(want.b));
}

// Puts the scene in a form the path tracer reads (the live scene's own lights,
// self-lit "basic" materials and environment mean nothing to it) and returns
// the function that puts everything back.
function preparePathScene(look, backdrop) {
  const undo = [];
  const added = [];

  // Standard stand-ins for the basic (self-lit) materials: the ceiling, the
  // downlight discs and the LED strips.
  const standIn = new Map();
  const evening = mood === 'evening';
  const swap = m => {
    if (!m || !m.isMeshBasicMaterial) return m;
    let s = standIn.get(m);
    if (!s) {
      s = new THREE.MeshStandardMaterial({ color: m.color.clone(), roughness: 0.9, metalness: 0, side: m.side });
      s.userData = m.userData;
      if (m === MAT.led) {
        s.emissive.copy(m.color); s.emissiveIntensity = evening ? 2.2 : 0.6;
      } else if (m.userData && m.userData.lamp) {
        s.color.set(0xffffff); s.emissive.set(0xfff0d8); s.emissiveIntensity = evening ? 6 : 0.8;
      }
      standIn.set(m, s);
    }
    return s;
  };
  scene.traverse(o => {
    if (o.isMesh) {
      const was = o.material;
      o.material = Array.isArray(was) ? was.map(swap) : swap(was);
      undo.push(() => { o.material = was; });
    } else if (o.isLight && o.visible) {
      o.visible = false;
      undo.push(() => { o.visible = true; });
    }
  });

  // The sun (the key light's own place), the sky, and the backdrop.
  scene.updateMatrixWorld(true);
  if (look.sun > 0 && keyLight) {
    const sun = new THREE.DirectionalLight(look.sunColor, look.sun);
    sun.position.copy(keyLight.getWorldPosition(new THREE.Vector3()));
    sun.target.position.copy(keyLight.target.getWorldPosition(new THREE.Vector3()));
    scene.add(sun, sun.target); added.push(sun, sun.target);
  }
  const sky = new window.PathTracerLib.GradientEquirectTexture(32);
  sky.topColor.set(look.skyTop); sky.bottomColor.set(look.skyBottom); sky.update();
  const env = scene.environment, bg = scene.background, envI = scene.environmentIntensity;
  scene.environment = sky; scene.environmentIntensity = look.sky; scene.background = backdrop;
  undo.push(() => { scene.environment = env; scene.background = bg; scene.environmentIntensity = envI; sky.dispose(); });

  // Area lights where the page has glowing things: a light for each LED
  // strip (facing down) and each downlight. Glowing geometry alone would
  // light the room only by chance, and speckle.
  const strip = new THREE.Vector3(), axis = new THREE.Vector3(), side = new THREE.Vector3(), up = new THREE.Vector3(0, 1, 0);
  const faceDown = (light, long) => {
    // With local +z up and x along the strip, the tracer lights downwards.
    side.crossVectors(up, long).normalize();
    light.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(long, side, up));
  };
  placedCabinets.forEach(c => {
    c.traverse(o => {
      if (!o.isMesh || o.material !== standIn.get(MAT.led) || !o.geometry.parameters) return;
      const w = o.geometry.parameters.width || 0.3;
      o.getWorldPosition(strip);
      axis.set(1, 0, 0).transformDirection(o.matrixWorld);
      const light = new THREE.RectAreaLight(MOODS[mood].led, look.strip, w, 0.05);
      light.position.copy(strip).add(new THREE.Vector3(0, -0.02, 0));
      faceDown(light, axis.clone());
      scene.add(light); added.push(light);
    });
  });
  if (look.down > 0 && roomGroup) {
    roomGroup.children.forEach(o => {
      if (!(o.isMesh && o.material.userData && o.material.userData.lamp && o.geometry.type === 'CircleGeometry')) return;
      const light = new THREE.RectAreaLight(0xffe2bd, look.down, 0.11, 0.11);
      light.isCircular = true;
      o.getWorldPosition(light.position); light.position.y -= 0.01;
      faceDown(light, new THREE.Vector3(1, 0, 0));
      scene.add(light); added.push(light);
    });
  }
  undo.push(() => { added.forEach(o => scene.remove(o)); });

  return () => { for (let i = undo.length - 1; i >= 0; i--) undo[i](); standIn.forEach(m => m.dispose()); };
}

// Tone maps what the path tracer has accumulated, then (lightly) denoises it,
// both in picture colours, and returns a JPEG data URL.
function pathFinish(pt, W, H, look, denoise) {
  const lib = window.PathTracerLib;
  const targets = [];
  const fsq = new lib.FullScreenQuad(new THREE.ShaderMaterial({
    uniforms: { map: { value: pt.target.texture }, exposure: { value: look.exposure } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `uniform sampler2D map; uniform float exposure; varying vec2 vUv;
      void main(){
        vec3 x = texture2D(map, vUv).rgb * exposure;
        vec3 c = clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0);
        gl_FragColor = vec4(pow(c, vec3(1.0 / 2.2)), 1.0);
      }`,
    depthTest: false, depthWrite: false,
  }));
  // Isolated bright or dark dots (a path that happened to find a light, or
  // missed one) are not edges, so the edge-preserving filter would keep them.
  // A pixel that differs sharply from the middle value of its 3x3 neighbours
  // AND has fewer than two neighbours like itself takes that middle value: a
  // fine line or an edge has neighbours like itself (along it), a speckle has
  // none.
  const despeckle = new lib.FullScreenQuad(new THREE.ShaderMaterial({
    uniforms: { map: { value: null }, texel: { value: new THREE.Vector2(1 / W, 1 / H) }, limit: { value: denoise.despeckle ?? 0.1 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }',
    fragmentShader: `uniform sampler2D map; uniform vec2 texel; uniform float limit; varying vec2 vUv;
      float lum(vec3 c) { return dot(c, vec3(0.299, 0.587, 0.114)); }
      void main(){
        vec3 c[9]; float l[9];
        for (int i = 0; i < 9; i++) {
          vec2 o = vec2(float(i - (i / 3) * 3 - 1), float(i / 3 - 1));
          c[i] = texture2D(map, vUv + o * texel).rgb; l[i] = lum(c[i]);
        }
        vec3 here = c[4]; float hereL = l[4];
        float alike = 0.0;
        for (int i = 0; i < 9; i++) if (i != 4 && abs(l[i] - hereL) < limit * 0.6) alike += 1.0;
        // The middle of nine: selection sort, five rounds.
        for (int i = 0; i < 5; i++) {
          int m = i;
          for (int j = i + 1; j < 9; j++) if (l[j] < l[m]) m = j;
          float tl = l[i]; l[i] = l[m]; l[m] = tl;
          vec3 tc = c[i]; c[i] = c[m]; c[m] = tc;
        }
        gl_FragColor = vec4(abs(hereL - l[4]) > limit && alike < 2.0 ? c[4] : here, 1.0);
      }`,
    depthTest: false, depthWrite: false,
  }));
  const mk = () => { const t = new THREE.WebGLRenderTarget(W, H, { type: THREE.UnsignedByteType, format: THREE.RGBAFormat, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter }); targets.push(t); return t; };
  const toned = mk(), cleaned = mk(), clean = mk();
  const before = renderer.getRenderTarget(), autoClear = renderer.autoClear;
  renderer.autoClear = false;
  renderer.setRenderTarget(toned); fsq.render(renderer);
  const dn = new lib.DenoiseMaterial();
  Object.assign(dn.uniforms.sigma, { value: denoise.sigma });
  dn.uniforms.threshold.value = denoise.threshold;
  dn.uniforms.kSigma.value = denoise.kSigma;
  const useDespeckle = (denoise.despeckle ?? 0.1) > 0;
  if (useDespeckle) {
    despeckle.material.uniforms.map.value = toned.texture;
    renderer.setRenderTarget(cleaned); despeckle.render(renderer);
  }
  dn.uniforms.map.value = (useDespeckle ? cleaned : toned).texture;
  const dq = new lib.FullScreenQuad(dn);
  renderer.setRenderTarget(clean); dq.render(renderer);
  renderer.setRenderTarget(before); renderer.autoClear = autoClear;
  const px = new Uint8Array(W * H * 4);
  renderer.readRenderTargetPixels(denoise.on ? clean : (useDespeckle ? cleaned : toned), 0, 0, W, H, px);
  fsq.material.dispose(); despeckle.material.dispose(); despeckle.dispose(); dn.dispose(); dq.dispose(); fsq.dispose();

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = H;
  const g = canvas.getContext('2d');
  const image = g.createImageData(W, H);
  for (let y = 0; y < H; y++) image.data.set(px.subarray((H - 1 - y) * W * 4, (H - y) * W * 4), y * W * 4);
  g.putImageData(image, 0, 0);
  targets.forEach(t => t.dispose());
  return canvas.toDataURL('image/jpeg', 0.92);
}
window.__pathFinish = pathFinish; // for the tests

// How hard to smooth for the samples a picture got: the fewer, the noisier,
// so the harder (a slow device that stopped at its time limit gets a softer
// picture, not a speckled one).
function pathDenoiseFor(samples) {
  if (samples >= 128) return { sigma: 2, kSigma: 2, threshold: 0.05, despeckle: 0.12 };
  if (samples >= 48) return { sigma: 2.5, kSigma: 2, threshold: 0.06, despeckle: 0.1 };
  if (samples >= 24) return { sigma: 2.5, kSigma: 2, threshold: 0.07, despeckle: 0.1 };
  return { sigma: 3, kSigma: 2, threshold: 0.1, despeckle: 0.06 };
}

// One picture, path traced: up to [samples] samples or [seconds] seconds, then
// tone mapped and lightly denoised on the graphics chip. Returns a JPEG data URL.
async function renderPathStill(pt, cam, W, H, opts, label, onProgress) {
  const look = PATH_LOOK[mood] || PATH_LOOK.day;
  const backdrop = pathBackdrop(MOODS[mood].background, look.exposure);
  const restore = preparePathScene(look, backdrop);
  try {
    pt.bounces = look.bounces;
    pt.setScene(scene, cam);
    window.__pathLights = pt._pathTracer.material.lights.count; // for the tests
    const tiles = pt.tiles.x * pt.tiles.y;
    let done = 0;
    // Wait for the shader to build, then sample.
    pt.renderSample();
    while (pt.isCompiling) {
      showRenderProgress(`${label}: preparing`);
      await nextFrame();
      if (renderCancelled) throw new Error('cancelled');
      pt.renderSample();
    }
    const budget = opts.seconds * 1000, started2 = performance.now();
    // Reading one pixel back waits for the graphics chip. gl.finish() doesn't
    // (the draws are only queued), and a loop that runs ahead of the chip
    // would make the progress and the time limit mean nothing.
    const probe = new Float32Array(4);
    while (pt.samples < opts.samples) {
      for (let k = 0; k < tiles; k++) pt.renderSample();
      renderer.readRenderTargetPixels(pt.target, 0, 0, 1, 1, probe);
      done = pt.samples;
      const elapsed = performance.now() - started2;
      const fraction = Math.min(1, Math.max(done / opts.samples, elapsed / budget));
      showRenderProgress(`${label} ${Math.round(100 * fraction)}%`);
      if (onProgress) onProgress(fraction);
      await nextFrame();
      if (renderCancelled) throw new Error('cancelled');
      if (elapsed > budget && done >= opts.minSamples) break;
    }

    const dataUrl = pathFinish(pt, W, H, look,
      opts.denoise.auto ? Object.assign(pathDenoiseFor(pt.samples), opts.denoise) : opts.denoise);
    window.__lastPathSamples = pt.samples;
    return dataUrl;
  } finally {
    restore();
  }
}

function makePathTracer(W, H) {
  const pt = new window.PathTracerLib.WebGLPathTracer(renderer);
  pt.renderDelay = 0; pt.minSamples = 0; pt.fadeDuration = 0;
  pt.rasterizeScene = false; pt.renderToCanvas = false; pt.dynamicLowRes = false;
  pt.filterGlossyFactor = 0.4;
  const t = pathTiles(W, H);
  pt.tiles.set(t, t);
  return pt;
}

// Frees the graphics memory a path tracer holds (its own dispose() leaves the
// scene's data textures behind).
function disposePathTracer(pt) {
  const seen = new Set();
  const free = v => {
    if (!v || typeof v !== 'object' || seen.has(v)) return;
    seen.add(v);
    if (typeof v.dispose === 'function') { try { v.dispose(); } catch (e) { /* already gone */ } }
    if (v.tex) free(v.tex);
  };
  for (const tracer of [pt._pathTracer, pt._lowResPathTracer]) {
    if (!tracer) continue;
    const m = tracer.material;
    if (m && m.uniforms) for (const key in m.uniforms) free(m.uniforms[key].value);
    for (const key of ['bvh', 'textures', 'materials', 'lights', 'iesProfiles', 'attributesArray', 'materialIndexAttribute', 'envMapInfo', 'stratifiedTexture', 'stratifiedSamplerCombined']) free(m && m[key]);
    try { tracer.dispose(); } catch (e) { /* not fully built */ }
  }
  if (pt._quad && pt._quad.material) { try { pt._quad.material.dispose(); } catch (e) { /* ignore */ } }
  if (pt._colorBackground) free(pt._colorBackground);
}

// How many tiles a picture is traced in per sample: a long single draw can
// make a phone's graphics chip give up, so big pictures go in pieces.
function pathTiles(W, H) {
  const px = W * H;
  return px > 900000 ? 4 : px > 300000 ? 2 : 1;
}

// Rendered pictures of the design (front and angled), one after the other.
// Resolves with [{ name, data }] and tells the app, as capturePictures does.
window.renderPictures = async function(requestId, options) {
  options = options || {};
  // engine 'path': true lighting (path tracing), if this device can; else the
  // sky-averaged render, and the app is told it fell back.
  const wantPath = options.engine === 'path';
  const usePath = wantPath && pathTracerAvailable();
  const samples = usePath
    ? Math.max(8, Math.min(2000, options.samples || 300))
    : Math.max(4, Math.min(200, options.samples || 40));
  const pathOptions = {
    samples,
    minSamples: Math.min(samples, options.minSamples || 12),
    seconds: Math.max(10, Math.min(900, options.seconds || 120)),
    denoise: Object.assign({ on: true, auto: true }, options.denoise || {}),
  };
  let pt = null;
  const images = [];
  const pathStats = { samples: [], seconds: [] }; // what a path-traced picture reached
  let cancelled = false;
  if (renderBusy) {
    notifyFlutter({ event: 'pictures', request_id: requestId || null, busy: true, images: [], names: [] });
    return images;
  }
  const box = designBox();
  if (!box.isEmpty() && renderer && scene && keyLight) {
    renderBusy = true;
    renderCancelled = false;
    // Textures still decoding: wait, so the render shows the real finishes.
    await new Promise(resolve => whenTexturesSettled(resolve));
    updateBacksplash();
    updateDecor();
    updateMoodLights();
    roomCapture = true;
    updateRoom();
    const prevRatio = renderer.getPixelRatio();
    const prevSize = renderer.getSize(new THREE.Vector2());
    const hidden = [selectionBox, snapGuideLine, houseGroup, previewGroup, previewOutline].filter(o => o && o.visible);
    const canvasEl = renderer.domElement;
    const wasHidden = canvasEl.style.visibility;
    try {
      hidden.forEach(o => { o.visible = false; });
      canvasEl.style.visibility = 'hidden';
      renderer.setPixelRatio(1);
      renderer.setSize(PICTURE_W, PICTURE_H, false);
      const cam = new THREE.PerspectiveCamera(38, PICTURE_W / PICTURE_H, 0.05, 200);
      const target = box.getCenter(new THREE.Vector3());
      const corners = [];
      for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) {
        corners.push(new THREE.Vector3(x, y, z));
      }
      const views = pictureViews().filter(v => !(options && options.only) || options.only === v.name);
      if (usePath) pt = makePathTracer(PICTURE_W, PICTURE_H);
      for (let n = 0; n < views.length; n++) {
        const view = views[n];
        const distance = pictureDistance(cam, target, view.dir, corners);
        cam.position.copy(target).addScaledVector(view.dir, distance);
        cam.lookAt(target);
        cam.updateMatrixWorld(true);
        const label = `Rendering picture ${n + 1} of ${views.length}`;
        const progress = fraction => notifyFlutter({ event: 'render_progress', request_id: requestId || null, fraction: (n + fraction) / views.length });
        const started = performance.now();
        const data = usePath
          ? await renderPathStill(pt, cam, PICTURE_W, PICTURE_H, pathOptions, label, progress)
          : await renderStill(cam, PICTURE_W, PICTURE_H, samples, label, progress);
        if (usePath) {
          pathStats.samples.push(Math.round(window.__lastPathSamples));
          pathStats.seconds.push(Math.round((performance.now() - started) / 100) / 10);
        }
        images.push({ name: view.name, data });
      }
    } catch (e) {
      if (e && e.message === 'cancelled') { cancelled = true; images.length = 0; }
      else console.error('renderPictures error:', e);
    } finally {
      if (pt) { if (options.keep) window.__pt = pt; else disposePathTracer(pt); }
      renderBusy = false;
      showRenderProgress(null);
      canvasEl.style.visibility = wasHidden;
      hidden.forEach(o => { o.visible = true; });
      roomCapture = false;
      updateRoom();
      renderer.setPixelRatio(prevRatio);
      renderer.setSize(prevSize.x, prevSize.y, false);
      onResize();
      invalidate();
    }
  }
  notifyFlutter({
    event: 'pictures', request_id: requestId || null, rendered: true, cancelled,
    engine: usePath ? 'path' : 'sky', fell_back: wantPath && !usePath,
    stats: usePath && !cancelled ? { samples: pathStats.samples, seconds: pathStats.seconds, gpu: gpuName() } : null,
    images: images.map(i => i.data), names: images.map(i => i.name),
  });
  return images;
};

// ── Toast ──────────────────────────────────────────────────────────────────
let toastTimer;
window.showToast = function(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
};
// Internal alias
function showToast(msg) { window.showToast(msg); }

// ── Boot ───────────────────────────────────────────────────────────────────
initScene();
</script>
</body>
