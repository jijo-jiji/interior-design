name: static_trace
description: Wall tracing and 3D cabinet layout app for sales demos.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5+9
  path_provider: ^2.1.2
  flutter_riverpod: ^2.5.1
  webview_flutter: ^4.7.0
  webview_flutter_android: ^3.16.4
  permission_handler: ^11.3.1
  uuid: ^4.3.3
  go_router: ^14.2.0
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  # Web support. Both were already resolved (via image_picker / camera), so
  # these lines pin nothing new.
  http: ^1.2.0
  web: ^1.0.0
  url_launcher: ^6.3.2
  printing: ^5.14.3
  google_mlkit_text_recognition: ^0.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/3d/
  # Bundled so the app looks right offline (it used to download the font at
  # runtime). SIL Open Font License: assets/fonts/OFL.txt
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
